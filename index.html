<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroGame</title>
<meta name="theme-color" content="#161625">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a07cff'/><stop offset='1' stop-color='%23ff8a5c'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><path d='M20 22h24a12 12 0 0 1 12 12v4a8 8 0 0 1-14 5l-3-3H25l-3 3a8 8 0 0 1-14-5v-4a12 12 0 0 1 12-12z' fill='%23161625'/><path d='M20 28v10M15 33h10' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/><circle cx='42' cy='30' r='2.8' fill='%23ffd34d'/><circle cx='47' cy='36' r='2.8' fill='%23ff6b8a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=optional" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root {
    color-scheme: dark;
    --bg: oklch(15% 0.02 275);
    --surface: oklch(22% 0.025 275 / 0.62);
    --surface-2: oklch(28% 0.03 275 / 0.7);
    --border: oklch(100% 0 0 / 0.09);
    --border-strong: oklch(100% 0 0 / 0.18);
    --text: oklch(97% 0.01 275);
    --muted: oklch(76% 0.02 275);
    --primary: oklch(70% 0.19 290);
    --accent: oklch(74% 0.17 35);
    --green: oklch(76% 0.18 150);
    --red: oklch(66% 0.22 18);
    --yellow: oklch(86% 0.17 92);
    --blue: oklch(70% 0.16 245);

    --fs-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
    --fs-sm: clamp(0.875rem, 0.8rem + 0.375vw, 1rem);
    --fs-base: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
    --fs-lg: clamp(1.25rem, 1.1rem + 0.75vw, 1.75rem);
    --fs-xl: clamp(1.75rem, 1.5rem + 1.25vw, 2.5rem);
    --fs-3xl: clamp(2.75rem, 1.8rem + 5vw, 5.5rem);

    --space-xs: clamp(0.5rem, 0.4rem + 0.5vw, 0.75rem);
    --space-sm: clamp(0.75rem, 0.6rem + 0.75vw, 1.125rem);
    --space-md: clamp(1rem, 0.8rem + 1vw, 1.5rem);
    --space-lg: clamp(1.5rem, 1.2rem + 1.5vw, 2.25rem);
    --space-xl: clamp(2rem, 1.6rem + 2vw, 3rem);

    --radius: 18px;
    --elev-1: 0 1px 3px oklch(0% 0 0 / 0.25);
    --elev-3: 0 12px 32px oklch(0% 0 0 / 0.35);
    --duration-fast: 150ms;
    --duration: 250ms;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh; background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, 'Segoe UI', sans-serif; font-size: var(--fs-base);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* fundo: manchas de luz que flutuam devagar (só transform, roda na GPU) */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .backdrop i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .35; animation: drift 26s var(--ease) infinite alternate; }
  .backdrop i:nth-child(1) { background: var(--primary); top: -25vmax; left: -15vmax; }
  .backdrop i:nth-child(2) { background: var(--accent); bottom: -30vmax; right: -20vmax; animation-delay: -9s; opacity: .22; }
  .backdrop i:nth-child(3) { background: var(--blue); top: 30%; left: 45%; width: 35vmax; height: 35vmax; animation-delay: -17s; opacity: .15; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  :focus:not(:focus-visible) { outline: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- botões ---------- */
  .btn {
    font: inherit; font-weight: 700; font-size: var(--fs-sm); min-height: 44px; padding: 0 1.25rem;
    border: 0; border-radius: 999px; cursor: pointer; color: oklch(15% 0.02 275);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: var(--elev-1); display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    transition: transform var(--duration) var(--ease-spring), box-shadow var(--duration) var(--ease), filter var(--duration-fast);
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--elev-3); }
  .btn:active { transform: scale(0.95); transition-duration: var(--duration-fast); }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { border-color: var(--border-strong); }

  .glass {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: var(--elev-3);
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-sm); padding: var(--space-xs) var(--space-md); flex-wrap: wrap;
    background: oklch(15% 0.02 275 / 0.6); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .logo { font: inherit; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.03em; background: none; border: 0; color: var(--text); cursor: pointer; min-height: 44px; padding: 0; }
  .logo span { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .who { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }
  /* largura fixa: o texto muda (conectando → compartilhado) sem empurrar o layout (CLS) */
  .pill { display: inline-flex; align-items: center; gap: .45em; font-size: var(--fs-xs); color: var(--muted); padding: .35em .8em; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); width: 17em; white-space: nowrap; overflow: hidden; }
  .pill #dbtxt { overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { min-width: 44px; padding: 0; font-size: 1.1rem; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
  .pill.on .dot { background: var(--green); box-shadow: 0 0 0 4px oklch(76% 0.18 150 / 0.2); }
  .chip { display: inline-flex; align-items: center; gap: .6em; padding: .25em .25em .25em .9em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 500; }
  .chip .btn { min-height: 36px; padding: 0 .9rem; font-size: var(--fs-xs); }

  main { max-width: 1120px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-xl); }

  /* ---------- menu ---------- */
  .hero { padding: var(--space-lg) 0 var(--space-xl); }
  .hero h1 { margin: 0; font-size: var(--fs-3xl); line-height: .95; letter-spacing: -0.045em; font-weight: 700; }
  .hero h1 em { font-style: normal; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: var(--space-sm) 0 0; color: var(--muted); font-size: var(--fs-lg); max-width: 34ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: var(--space-sm); }
  .card {
    --h: 290; position: relative; text-align: left; font: inherit; color: inherit; cursor: pointer;
    padding: var(--space-md); display: flex; flex-direction: column; gap: .4rem; min-height: 200px;
    animation: rise .55s var(--ease-spring) both; animation-delay: calc(var(--i) * 60ms);
    transition: transform var(--duration) var(--ease-spring), border-color var(--duration), box-shadow var(--duration);
  }
  .card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(120% 80% at 0% 0%, oklch(70% 0.15 var(--h) / 0.16), transparent 60%); pointer-events: none; }
  .card:hover { transform: translateY(-6px); border-color: oklch(72% 0.15 var(--h) / 0.55); box-shadow: 0 18px 40px oklch(60% 0.15 var(--h) / 0.25); }
  .card:active { transform: scale(0.97); }
  .card .icon { width: 56px; height: 56px; display: grid; place-items: center; font-size: 28px; border-radius: 16px; background: oklch(70% 0.15 var(--h) / 0.18); border: 1px solid oklch(72% 0.15 var(--h) / 0.3); transition: transform var(--duration) var(--ease-spring); }
  .card:hover .icon { transform: rotate(-8deg) scale(1.1); }
  .card h3 { margin: .5rem 0 0; font-size: var(--fs-lg); letter-spacing: -0.02em; }
  .card p { margin: 0; color: var(--muted); font-size: var(--fs-sm); line-height: 1.45; }
  .card .rec { margin-top: auto; padding-top: .6rem; font-size: var(--fs-xs); color: var(--muted); display: flex; gap: .4em; align-items: center; }
  .card .rec b { color: oklch(85% 0.12 var(--h)); font-weight: 700; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }

  .kings { margin-top: var(--space-xl); padding: var(--space-md); }
  .kings h2 { margin: 0 0 var(--space-sm); font-size: var(--fs-lg); letter-spacing: -0.02em; }
  .kings ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .kings li { padding: .5em 1em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-sm); }
  .kings li b { color: var(--yellow); }

  /* ---------- tela de jogo ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-md); align-items: start; }
  /* minmax(0, …): a coluna pode encolher abaixo da largura do canvas do Phaser (senão vira rolagem lateral no celular) */
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  /* Tela de jogo compacta: o jogo tem que caber na altura da tela sem rolar (senão o placar/tempo some).
     --avail (px) = altura que sobra pro #game até o fim da tela; calculada no JS (fitGame). */
  main.game-view { padding-top: var(--space-sm); padding-bottom: var(--space-sm); }
  .stage { padding: var(--space-sm) var(--space-md) var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm); }
  .stage-head { display: flex; align-items: center; gap: var(--space-sm); }
  .stage-head .title { flex: 1; min-width: 0; }
  .stage-head h2 { margin: 0; font-size: var(--fs-lg); letter-spacing: -0.03em; display: flex; align-items: center; gap: .4em; }
  .stage-head p { margin: .1rem 0 0; color: var(--muted); font-size: var(--fs-xs); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .game { --avail: 520px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); }
  .game .hud .stat { padding: .3em .85em; }
  .hud { display: flex; gap: var(--space-xs); flex-wrap: wrap; justify-content: center; }
  .stat { padding: .45em 1em; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-sm); color: var(--muted); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; font-size: var(--fs-base); margin-left: .25em; }
  .hint { color: var(--muted); text-align: center; margin: 0; font-size: var(--fs-sm); }

  .board { padding: var(--space-md); position: sticky; top: 80px; max-height: calc(100dvh - 96px); overflow: auto; }
  .board h3 { margin: 0 0 var(--space-sm); font-size: var(--fs-lg); letter-spacing: -0.02em; }
  .board ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .board li { display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: .5rem; padding: .55em .7em; border-radius: 12px; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .board li:nth-child(odd) { background: oklch(100% 0 0 / 0.03); }
  .board li.me { background: oklch(70% 0.19 290 / 0.18); outline: 1px solid oklch(70% 0.19 290 / 0.4); }
  .board .pos { text-align: center; color: var(--muted); }
  .board .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .empty { color: var(--muted); margin: 0; }

  .result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); animation: pop .5s var(--ease-spring); }
  .result .score { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .result .label { color: var(--muted); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .12em; }
  .badge { padding: .4em 1em; border-radius: 999px; background: oklch(86% 0.17 92 / 0.15); color: var(--yellow); border: 1px solid oklch(86% 0.17 92 / 0.35); font-weight: 700; font-size: var(--fs-sm); }
  .badge.warn { background: oklch(66% 0.22 18 / 0.15); color: oklch(82% 0.12 18); border-color: oklch(66% 0.22 18 / 0.4); max-width: 42ch; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }

  /* Reflexo */
  .reflex { width: 100%; height: clamp(150px, calc(var(--avail) - 56px), 320px); border-radius: var(--radius); display: grid; place-items: center; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; user-select: none; cursor: pointer; text-align: center; padding: 1rem; border: 0; font-family: inherit; color: oklch(15% 0.02 275); transition: background var(--duration-fast); }
  .reflex.wait { background: var(--red); color: var(--text); }
  .reflex.go { background: var(--green); }
  .reflex.early { background: var(--yellow); }
  .reflex.between { background: var(--blue); }
  /* Clique */
  .bigbtn { width: min(240px, 70vw, calc(var(--avail) - 70px)); aspect-ratio: 1; border-radius: 50%; border: 0; font: inherit; font-size: var(--fs-lg); font-weight: 700; color: oklch(15% 0.02 275); cursor: pointer; user-select: none;
    background: radial-gradient(circle at 35% 30%, oklch(82% 0.15 35), var(--accent) 45%, var(--red)); box-shadow: 0 10px 0 oklch(45% 0.16 20), 0 24px 50px oklch(66% 0.22 18 / 0.35); transition: transform 80ms, box-shadow 80ms; }
  .bigbtn:active { transform: translateY(8px); box-shadow: 0 2px 0 oklch(45% 0.16 20), 0 10px 30px oklch(66% 0.22 18 / 0.35); }
  /* Digitação */
  .words { font-size: var(--fs-lg); line-height: 1.8; background: var(--surface-2); padding: var(--space-sm) var(--space-md); border-radius: 14px; width: 100%; min-height: 110px; border: 1px solid var(--border); }
  .words span { padding: 0 .15em; border-radius: 6px; }
  .words .cur { background: oklch(70% 0.19 290 / 0.35); outline: 1px solid var(--primary); }
  .words .ok { color: var(--green); }
  .words .bad { color: var(--red); text-decoration: line-through; }
  input.txt { font: inherit; font-size: var(--fs-lg); padding: .6em 1em; border-radius: 14px; border: 1px solid var(--border-strong); background: oklch(12% 0.02 275 / 0.7); color: var(--text); width: 100%; max-width: 440px; text-align: center; min-height: 44px; transition: border-color var(--duration), box-shadow var(--duration); }
  input.txt:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px oklch(70% 0.19 290 / 0.25); }
  input.txt.wrong { border-color: var(--red); animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  /* Memória */
  .simon { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(300px, 80vw, calc(var(--avail) - 100px)); aspect-ratio: 1; }
  .pad { border: 0; border-radius: 24px; opacity: .3; cursor: pointer; transition: opacity 90ms, transform 90ms; }
  .pad:nth-child(1) { border-top-left-radius: 50%; } .pad:nth-child(2) { border-top-right-radius: 50%; }
  .pad:nth-child(3) { border-bottom-left-radius: 50%; } .pad:nth-child(4) { border-bottom-right-radius: 50%; }
  .pad.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 40px currentColor; }
  /* Jogos em Phaser (Cobrinha, Mira): a caixa reserva o espaço antes do Phaser carregar (sem CLS) */
  .phaser-wrap { width: 100%; margin: 0 auto; display: grid; place-items: center; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #1d1f2e; touch-action: none; }
  /* contain: size → a caixa fica no tamanho calculado (largura + aspect-ratio) mesmo se o canvas
     ainda estiver no tamanho original antes do Phaser aplicar a escala */
  .phaser-wrap { contain: size; }
  .phaser-wrap canvas { display: block; cursor: crosshair; max-width: 100%; max-height: 100%; }
  .reflex, .bigbtn, .pad { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  input.txt.right { border-color: var(--green); box-shadow: 0 0 0 4px oklch(76% 0.18 150 / 0.25); }
  /* Cor Certa (Stroop) */
  .stroop-word { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.03em; line-height: 1; min-height: 1.1em; user-select: none; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(440px, 100%); }
  .choices .btn { min-height: 56px; font-size: var(--fs-base); }
  .choices kbd { font: inherit; font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 .4em; }
  .shake { animation: shake .25s; }
  /* Caça Números (Schulte) */
  .schulte { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: min(400px, 100%, calc(var(--avail) - 56px)); }
  .cell { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: var(--fs-lg); font-weight: 700; cursor: pointer; touch-action: manipulation; transition: opacity var(--duration), transform var(--duration-fast); }
  .cell:hover { border-color: var(--border-strong); }
  .cell.done { opacity: .18; transform: scale(.92); }
  .cell.miss { border-color: var(--red); animation: shake .25s; }
  .schulte.hidden .cell { color: var(--muted); opacity: .45; cursor: default; }
  .schulte-wrap { position: relative; display: grid; place-items: center; width: 100%; }
  .schulte-wrap #go { position: absolute; min-height: 56px; font-size: var(--fs-lg); padding: 0 1.75rem; box-shadow: var(--elev-3); }
  /* Toupeira */
  .moles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(380px, 100%, calc(var(--avail) - 100px)); }
  .hole { position: relative; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border); overflow: hidden; cursor: pointer; touch-action: manipulation; padding: 0; font: inherit;
    background: radial-gradient(ellipse at 50% 70%, oklch(10% 0.02 275) 0 45%, var(--surface-2) 46%); }
  .hole span { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(2rem, 9vw, 3rem); transform: translateY(105%); transition: transform 110ms var(--ease); pointer-events: none; }
  .hole.up span { transform: translateY(0); }
  .hole.hit { background: radial-gradient(ellipse at 50% 70%, oklch(40% 0.12 150) 0 45%, var(--surface-2) 46%); }
  .hole.boom { background: radial-gradient(ellipse at 50% 70%, oklch(45% 0.18 18) 0 45%, var(--surface-2) 46%); }
  /* Conta */
  .math { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; background: oklch(10% 0.02 275 / 0.6); backdrop-filter: blur(6px); display: grid; place-items: center; padding: var(--space-md); animation: fade .2s; }
  .modal .box { width: 100%; max-width: 380px; padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-sm); text-align: center; animation: pop .35s var(--ease-spring); }
  .modal h2 { margin: 0; font-size: var(--fs-xl); letter-spacing: -0.03em; }
  .modal p { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
  .modal form { display: flex; flex-direction: column; gap: var(--space-sm); }
  .modal .err { color: oklch(80% 0.14 18); font-size: var(--fs-sm); min-height: 1.2em; margin: 0; }
  .modal .box.wide { max-width: 560px; text-align: left; }
  .modal input.txt { max-width: none; font-size: var(--fs-base); text-align: left; }

  /* ---------- conta (menu do topo) ---------- */
  .acct { position: relative; }
  .acct-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 200px; padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 15; }
  .acct-menu[hidden] { display: none; }
  .acct-menu button { font: inherit; text-align: left; background: none; border: 0; color: var(--text); padding: .6em .8em; border-radius: 10px; cursor: pointer; min-height: 40px; }
  .acct-menu button:hover { background: var(--surface-2); }

  /* ---------- bloqueio por fila do Geiko ---------- */
  .gate { margin: 0 0 var(--space-md); padding: var(--space-sm) var(--space-md); display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }

<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="who">

    <span class="chip acct">👤 <b id="pname">—</b><button class="btn ghost" id="acctBtn" aria-haspopup="menu" aria-expanded="false">Conta ▾</button>
      <span class="acct-menu glass" id="acctMenu" role="menu" hidden>

        <button role="menuitem" id="mPass">🔑 Trocar senha</button>
        <button role="menuitem" id="mLogout">🚪 Sair</button>
      </span>
    </span>
  </div>
</header>
<main id="main">
  <!-- já vem no HTML: é o maior elemento da tela (LCP) e aparece antes de qualquer JS -->
  <section class="hero">
    <h1>Hora do <em>intervalo</em>.</h1>
    <p>13 minigames rápidos. Bata o recorde da galera.</p>
  </section>
</main>
<div class="sr-only" role="status" aria-live="polite" id="live"></div>

<script>
const $ = s => document.querySelector(s);
const main = $('#main');
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Conta logada (vem de /api/auth/me) e o resultado do bloqueio por fila do Geiko.
let me = null, gate = null, player = '';
let cleanup = null;

// ---------- placar ----------
// Aberto pelo server.js: salva no banco (SQLite). Se o envio falhar, guarda numa fila e reenvia depois.
// Aberto direto do arquivo (file://): ranking só no localStorage deste navegador.
const localMode = location.protocol === 'file:';
// começa com o ranking da última visita (mg_cache) pra desenhar o menu sem esperar a rede
let scores = localMode ? readJson('mg_scores', {}) : readJson('mg_cache', {}), online = false;
function readJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
const localScores = () => readJson('mg_scores', {});
const pending = () => readJson('mg_pending', []);
// Lança erro com .rejected = true quando o servidor recusa a pontuação (4xx): não adianta reenviar.
async function postScore(entry) {
  const r = await fetch('api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) });
  if (!r.ok) {
    const err = new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    err.rejected = r.status >= 400 && r.status < 500;
    throw err;
  }
}
async function flushPending() {
  const queue = pending();
  while (queue.length) {
    try { await postScore(queue[0]); }
    catch (e) { if (!e.rejected) throw e; }
    queue.shift();
    localStorage.setItem('mg_pending', JSON.stringify(queue));
  }
}
async function fetchScores() {
  if (localMode) { scores = localScores(); online = false; }
  else {
    try {
      await flushPending();
      const r = await fetch('api/scores');
      if (!r.ok) throw new Error(r.status);
      scores = await r.json(); online = true;
      try { localStorage.setItem('mg_cache', JSON.stringify(scores)); } catch {}
    } catch { online = false; }
  }
  const waiting = pending().length;
  $('#db').classList.toggle('on', online);
  $('#dbtxt').textContent = localMode ? 'ranking só neste navegador'
    : online ? 'ranking compartilhado'
    : `servidor fora do ar${waiting ? ` · ${waiting} pra enviar` : ''}`;
}
function bestPerPlayer(gameId) {
  const g = GAMES[gameId];
  const best = {};
  for (const s of scores[gameId] || []) {
    if (!(s.name in best) || better(g, s.score, best[s.name])) best[s.name] = s.score;
  }
  return Object.entries(best).sort((a, b) => better(g, a[1], b[1]) ? -1 : 1);
}
function better(g, a, b) { return g.better === 'low' ? a < b : a > b; }
// Retorna 'ok' (salvou), 'queued' (servidor fora, reenvia depois) ou a mensagem de recusa do servidor.
async function saveScore(gameId, score, proof) {
  const entry = { game: gameId, player, score, proof };
  if (localMode) {
    const all = localScores();
    (all[gameId] = all[gameId] || []).push({ name: player, score, date: Date.now() });
    localStorage.setItem('mg_scores', JSON.stringify(all));
    scores = all;
    return 'ok';
  }
  try {
    await postScore(entry);
    await fetchScores();
    return 'ok';
  } catch (e) {
    if (e.rejected) return e.message;
    localStorage.setItem('mg_pending', JSON.stringify([...pending(), entry]));
    // mostra no ranking local enquanto não sobe pro servidor
    (scores[gameId] = scores[gameId] || []).push({ name: player, score, date: Date.now() });
    await fetchScores();
    return 'queued';
  }
}
function fmt(g, v) { return (g.decimals ? v.toFixed(g.decimals) : v) + ' ' + g.unit; }

// ---------- som ----------
// Bipes sintetizados (Web Audio), sem arquivos. Botão 🔊 no topo liga/desliga.
let muted = localStorage.getItem('mg_mute') === '1';
let audioCtx = null;
function beep(freq, ms = 90, type = 'sine', vol = 0.07) {
  if (muted) return;
  try {
    audioCtx ??= new AudioContext();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + ms / 1000);
  } catch {}
}
const sfx = {
  good: () => beep(880, 70, 'triangle'),
  bad: () => beep(130, 220, 'sawtooth', 0.05),
  record: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 140, 'triangle'), i * 90)),
};
function renderMute() {
  $('#mute').textContent = muted ? '🔇' : '🔊';
  $('#mute').setAttribute('aria-label', muted ? 'Ligar som' : 'Desligar som');
}

// ---------- Phaser ----------
// ~1 MB: só baixa quando alguém abre a Cobrinha ou a Mira (no menu, fica pré-buscado em segundo plano).
const PHASER_URL = 'https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';
let phaserLoading = null;
function loadPhaser() {
  return phaserLoading ??= new Promise((resolve, reject) => {
    if (window.Phaser) return resolve();
    const s = document.createElement('script');
    s.src = PHASER_URL;
    s.onload = resolve;
    s.onerror = () => { phaserLoading = null; s.remove(); reject(new Error('Não deu pra carregar o Phaser. Confere a internet e tenta de novo.')); };
    document.head.append(s);
  });
}
function prefetchPhaser() {
  if (window.Phaser || $('link[data-phaser]')) return;
  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 1500));
  idle(() => document.head.insertAdjacentHTML('beforeend', `<link rel="prefetch" as="script" href="${PHASER_URL}" data-phaser>`));
}
// Cria o jogo dentro de `wrap` (que já reserva o espaço). Retorna a função de limpeza.
// O tamanho na tela encolhe pra caber na largura E na altura que sobram (placar e dicas continuam visíveis).
function mountPhaser(wrap, width, height, scene) {
  let game = null, dead = false;
  wrap.style.maxWidth = width + 'px';
  wrap.style.aspectRatio = `${width} / ${height}`;
  wrap.innerHTML = '<p class="hint">Carregando...</p>';
  const size = () => {
    const box = wrap.parentElement, cs = getComputedStyle(box);
    const gap = parseFloat(cs.rowGap) || 0;
    const others = [...box.children].filter(c => c !== wrap).reduce((sum, c) => sum + c.offsetHeight + gap, 0);
    const maxH = (parseFloat(cs.getPropertyValue('--avail')) || height) - others;
    const scale = Math.max(0.35, Math.min(1, box.clientWidth / width, maxH / height));
    // !important: nada (CSS do layout, Phaser) pode esticar a caixa além do tamanho calculado
    wrap.style.setProperty('width', Math.floor(width * scale) + 'px', 'important');
    wrap.style.setProperty('height', Math.floor(height * scale) + 'px', 'important');
    game?.scale.refresh();
  };
  size();
  addEventListener('mg:fit', size);
  loadPhaser().then(() => {
    if (dead) return;
    wrap.innerHTML = '';
    game = new Phaser.Game({
      type: Phaser.AUTO, parent: wrap, width, height, backgroundColor: '#1d1f2e', banner: false,
      audio: { noAudio: true },
      // expandParent: false — senão o Phaser às vezes troca a altura da caixa pra 100% e o jogo estoura a tela
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
      scene,
    });
  }).catch(e => { if (!dead) wrap.innerHTML = `<p class="hint">⚠️ ${esc(e.message)}</p>`; });
  return () => { dead = true; removeEventListener('mg:fit', size); game?.destroy(true); };
}
// Altura que sobra pro #game até o fim da tela (com a página no topo) → variável CSS --avail.
// Os jogos em HTML usam no CSS; os em Phaser, no mountPhaser (evento mg:fit).
function fitGame() {
  const el = $('#game');
  if (!el) return;
  const top = el.getBoundingClientRect().top + scrollY;
  el.style.setProperty('--avail', Math.max(240, Math.floor(innerHeight - top - 40)) + 'px');
  dispatchEvent(new Event('mg:fit'));
}
let fitTimer = 0;
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitGame, 120); });
// Cor CSS (inclusive oklch) → número 0xRRGGBB que o Phaser entende.
function hex(cssVar) {
  const c = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  c.fillStyle = css(cssVar); c.fillRect(0, 0, 1, 1);
  const [r, g, b] = c.getImageData(0, 0, 1, 1).data;
  return (r << 16) | (g << 8) | b;
}
// Textura de pontinho branco pras partículas (pintada com `tint`).
function dotTexture(scene) {
  if (scene.textures.exists('dot')) return;
  scene.add.graphics().fillStyle(0xffffff).fillCircle(4, 4, 4).generateTexture('dot', 8, 8).destroy();
}
function floatText(scene, x, y, text, color) {
  const t = scene.add.text(x, y, text, { fontFamily: 'Space Grotesk, system-ui, sans-serif', fontSize: '22px', fontStyle: 'bold', color }).setOrigin(0.5);
  scene.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 650, ease: 'Cubic.Out', onComplete: () => t.destroy() });
}

// ---------- jogos ----------
const GAMES = {
  reflexo: {
    name: 'Reflexo', emoji: '⚡', hue: 92, desc: 'Clique (ou Espaço) quando ficar verde. Média de 3 rodadas. Clicou antes? Recomeça do zero!',
    better: 'low', unit: 'ms',
    start(el, done) {
      let times = [], timer, startAt, state;
      el.innerHTML = '<div class="hud"><span class="stat">Rodada<b id="rd"></b></span></div><button class="reflex" id="rx"></button>';
      const box = el.querySelector('#rx');
      const set = (cls, txt) => { box.className = 'reflex ' + cls; box.textContent = txt; };
      function wait() {
        state = 'wait';
        el.querySelector('#rd').textContent = `${times.length + 1}/3`;
        set('wait', 'Espere o verde...');
        timer = setTimeout(() => { state = 'go'; startAt = performance.now(); set('go', 'CLIQUE!'); }, rand(1500, 4000));
      }
      // pointerdown = mouse e toque; Espaço/Enter também valem (sem repetição de tecla segurada)
      box.onkeydown = e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } };
      box.onpointerdown = () => press();
      // Anti-spam: clicar antes do verde zera as 3 rodadas e trava os cliques por 1s
      // — senão compensava ficar metralhando o botão até pegar um tempo bom.
      let lockedUntil = 0;
      const early = msg => {
        clearTimeout(timer);
        times = [];
        state = 'early';
        lockedUntil = performance.now() + 1000;
        sfx.bad();
        set('early', `${msg} Recomeçando do zero — clique pra tentar de novo.`);
        el.querySelector('#rd').textContent = '1/3';
      };
      const press = () => {
        if (state === 'wait') early('Cedo demais!');
        else if (state === 'early') { if (performance.now() >= lockedUntil) wait(); }
        else if (state === 'go') {
          times.push(Math.round(performance.now() - startAt));
          if (times.length === 3) return done(Math.round(times.reduce((a, b) => a + b) / 3));
          state = 'between'; set('between', `${times.at(-1)} ms — clique pra próxima`);
        } else if (state === 'between') wait();
      };
      wait();
      box.focus();
      return () => clearTimeout(timer);
    }
  },
  clique: {
    name: 'Clique Maluco', emoji: '👆', hue: 20, desc: 'Quantos cliques você dá em 10 segundos?',
    better: 'high', unit: 'cliques',
    // Mesma regra do server.js (cheatReason). Retorna o motivo se parecer autoclicker.
    check(score, proof) {
      if (score > 200) return 'cliques demais pra um humano';
      if (proof.length >= 50) {
        const mean = proof.reduce((a, b) => a + b, 0) / proof.length;
        const sd = Math.sqrt(proof.reduce((a, b) => a + (b - mean) ** 2, 0) / proof.length);
        if (mean > 0 && sd / mean < 0.05) return 'ritmo regular demais';
      }
      return null;
    },
    start(el, done) {
      let n = 0, t0 = 0, last = 0, iv; const gaps = [];
      el.innerHTML = '<div class="hud"><span class="stat">Cliques<b id="n">0</b></span><span class="stat">Tempo<b id="t">10.0s</b></span></div><button class="bigbtn" id="b">CLIQUE<br>PRA COMEÇAR</button>';
      const b = el.querySelector('#b');
      b.onpointerdown = () => {
        if (!t0) {
          t0 = performance.now(); b.innerHTML = 'CLIQUE!';
          iv = setInterval(() => {
            const left = 10 - (performance.now() - t0) / 1000;
            el.querySelector('#t').textContent = Math.max(0, left).toFixed(1) + 's';
            if (left <= 0) { clearInterval(iv); done(n, gaps); }
          }, 50);
        }
        const now = performance.now();
        if (last) gaps.push(Math.round(now - last));
        last = now;
        el.querySelector('#n').textContent = ++n;
      };
      return () => clearInterval(iv);
    }
  },
  digitacao: {
    name: 'Digitação', emoji: '⌨️', hue: 245, desc: 'Digite o máximo de palavras certas em 30s.',
    better: 'high', unit: 'palavras',
    start(el, done) {
      const pool = 'casa café reunião planilha email chefe projeto prazo cliente sistema relatório banana janela teclado monitor cadeira trabalho sexta feira almoço tarefa pessoa código servidor rede mouse papel caneta agenda equipe meta ideia gato cachorro sol chuva verde azul rápido lento grande pequeno feliz carro mesa porta livro música filme jogo'.split(' ');
      const words = Array.from({ length: 120 }, () => pool[rand(0, pool.length - 1)]);
      let i = 0, ok = 0, t0 = 0, iv; const res = [];
      el.innerHTML = '<div class="hud"><span class="stat">Certas<b id="ok">0</b></span><span class="stat">Tempo<b id="t">30s</b></span></div><div class="words" id="w"></div><input class="txt" id="in" placeholder="comece a digitar..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Digite as palavras">';
      const w = el.querySelector('#w'), inp = el.querySelector('#in');
      function render() {
        const from = Math.max(0, i - 4);
        w.innerHTML = words.slice(from, i + 12).map((x, k) => {
          const idx = from + k;
          const cls = idx === i ? 'cur' : idx < i ? (res[idx] ? 'ok' : 'bad') : '';
          return `<span class="${cls}">${x}</span>`;
        }).join(' ');
      }
      inp.oninput = () => {
        if (!t0) {
          t0 = performance.now();
          iv = setInterval(() => {
            const left = 30 - (performance.now() - t0) / 1000;
            el.querySelector('#t').textContent = Math.max(0, Math.ceil(left)) + 's';
            if (left <= 0) { clearInterval(iv); inp.disabled = true; done(ok); }
          }, 100);
        }
        if (inp.value.endsWith(' ')) {
          res[i] = inp.value.trim() === words[i];
          if (res[i]) el.querySelector('#ok').textContent = ++ok;
          i++; inp.value = ''; render();
        }
      };
      render(); inp.focus();
      return () => clearInterval(iv);
    }
  },
  memoria: {
    name: 'Memória', emoji: '🧠', hue: 330, desc: 'Repita a sequência de cores. Quanto mais longe, melhor.',
    better: 'high', unit: 'rodadas',
    start(el, done) {
      const colors = ['--green', '--red', '--yellow', '--blue'];
      const seq = []; let pos = 0, busy = true, timers = [];
      el.innerHTML = '<div class="hud"><span class="stat">Rodada<b id="r">0</b></span></div><p class="hint" id="h">Observe...</p><div class="simon">' +
        colors.map((c, k) => `<button class="pad" data-k="${k}" aria-label="cor ${k + 1}" style="background:var(${c});color:var(${c})"></button>`).join('') + '</div>';
      const pads = [...el.querySelectorAll('.pad')];
      const TONES = [330, 262, 392, 196]; // um tom por cor, estilo Genius
      const flash = (k, ms = 350) => {
        pads[k].classList.add('lit'); beep(TONES[k], ms, 'triangle');
        timers.push(setTimeout(() => pads[k].classList.remove('lit'), ms));
      };
      function next() {
        seq.push(rand(0, 3)); pos = 0; busy = true;
        el.querySelector('#r').textContent = seq.length;
        el.querySelector('#h').textContent = 'Observe...';
        const step = Math.max(300, 600 - seq.length * 20);
        seq.forEach((k, j) => timers.push(setTimeout(() => flash(k, step * .7), 600 + j * step)));
        timers.push(setTimeout(() => { busy = false; el.querySelector('#h').textContent = 'Sua vez!'; }, 600 + seq.length * step));
      }
      pads.forEach(p => p.onpointerdown = () => {
        if (busy) return;
        const k = +p.dataset.k;
        if (k !== seq[pos]) {
          busy = true; sfx.bad(); pads[seq[pos]].classList.add('lit'); // mostra qual era a certa
          return timers.push(setTimeout(() => done(seq.length - 1), 700));
        }
        flash(k, 200);
        if (++pos === seq.length) { busy = true; timers.push(setTimeout(next, 500)); }
      });
      next();
      return () => timers.forEach(clearTimeout);
    }
  },
  mira: {
