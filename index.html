<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroGame</title>
<meta name="theme-color" content="#161625">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a07cff'/><stop offset='1' stop-color='%23ff8a5c'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><path d='M20 22h24a12 12 0 0 1 12 12v4a8 8 0 0 1-14 5l-3-3H25l-3 3a8 8 0 0 1-14-5v-4a12 12 0 0 1 12-12z' fill='%23161625'/><path d='M20 28v10M15 33h10' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/><circle cx='42' cy='30' r='2.8' fill='%23ffd34d'/><circle cx='47' cy='36' r='2.8' fill='%23ff6b8a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=optional" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root {
    color-scheme: dark;
    --bg: oklch(15% 0.02 275);
    --surface: oklch(22% 0.025 275 / 0.62);
    --surface-2: oklch(28% 0.03 275 / 0.7);
    --border: oklch(100% 0 0 / 0.09);
    --border-strong: oklch(100% 0 0 / 0.18);
    --text: oklch(97% 0.01 275);
    --muted: oklch(76% 0.02 275);
    --primary: oklch(70% 0.19 290);
    --accent: oklch(74% 0.17 35);
    --green: oklch(76% 0.18 150);
    --red: oklch(66% 0.22 18);
    --yellow: oklch(86% 0.17 92);
    --blue: oklch(70% 0.16 245);

    --fs-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
    --fs-sm: clamp(0.875rem, 0.8rem + 0.375vw, 1rem);
    --fs-base: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
    --fs-lg: clamp(1.25rem, 1.1rem + 0.75vw, 1.75rem);
    --fs-xl: clamp(1.75rem, 1.5rem + 1.25vw, 2.5rem);
    --fs-3xl: clamp(2.75rem, 1.8rem + 5vw, 5.5rem);

    --space-xs: clamp(0.5rem, 0.4rem + 0.5vw, 0.75rem);
    --space-sm: clamp(0.75rem, 0.6rem + 0.75vw, 1.125rem);
    --space-md: clamp(1rem, 0.8rem + 1vw, 1.5rem);
    --space-lg: clamp(1.5rem, 1.2rem + 1.5vw, 2.25rem);
    --space-xl: clamp(2rem, 1.6rem + 2vw, 3rem);

    --radius: 18px;
    --elev-1: 0 1px 3px oklch(0% 0 0 / 0.25);
    --elev-3: 0 12px 32px oklch(0% 0 0 / 0.35);
    --duration-fast: 150ms;
    --duration: 250ms;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100dvh; background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, 'Segoe UI', sans-serif; font-size: var(--fs-base);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* fundo: manchas de luz que flutuam devagar (só transform, roda na GPU) */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .backdrop i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .35; animation: drift 26s var(--ease) infinite alternate; }
  .backdrop i:nth-child(1) { background: var(--primary); top: -25vmax; left: -15vmax; }
  .backdrop i:nth-child(2) { background: var(--accent); bottom: -30vmax; right: -20vmax; animation-delay: -9s; opacity: .22; }
  .backdrop i:nth-child(3) { background: var(--blue); top: 30%; left: 45%; width: 35vmax; height: 35vmax; animation-delay: -17s; opacity: .15; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  :focus:not(:focus-visible) { outline: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- botões ---------- */
  .btn {
    font: inherit; font-weight: 700; font-size: var(--fs-sm); min-height: 44px; padding: 0 1.25rem;
    border: 0; border-radius: 999px; cursor: pointer; color: oklch(15% 0.02 275);
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: var(--elev-1); display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    transition: transform var(--duration) var(--ease-spring), box-shadow var(--duration) var(--ease), filter var(--duration-fast);
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--elev-3); }
  .btn:active { transform: scale(0.95); transition-duration: var(--duration-fast); }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { border-color: var(--border-strong); }

  .glass {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow: var(--elev-3);
  }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-sm); padding: var(--space-xs) var(--space-md); flex-wrap: wrap;
    background: oklch(15% 0.02 275 / 0.6); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .logo { font: inherit; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.03em; background: none; border: 0; color: var(--text); cursor: pointer; min-height: 44px; padding: 0; }
  .logo span { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .who { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }
  /* largura fixa: o texto muda (conectando → compartilhado) sem empurrar o layout (CLS) */
  .pill { display: inline-flex; align-items: center; gap: .45em; font-size: var(--fs-xs); color: var(--muted); padding: .35em .8em; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); width: 17em; white-space: nowrap; overflow: hidden; }
  .pill #dbtxt { overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { min-width: 44px; padding: 0; font-size: 1.1rem; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
  .pill.on .dot { background: var(--green); box-shadow: 0 0 0 4px oklch(76% 0.18 150 / 0.2); }
  .chip { display: inline-flex; align-items: center; gap: .6em; padding: .25em .25em .25em .9em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-weight: 500; }
  .chip .btn { min-height: 36px; padding: 0 .9rem; font-size: var(--fs-xs); }
  /* largura fixa: o nome chega depois do login ("—" → "Fulano") e não pode mudar o tamanho do topo (CLS) */
  #pname { display: inline-block; width: 8.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }

  main { max-width: 1120px; margin: 0 auto; padding: var(--space-lg) var(--space-md) var(--space-xl); }

  /* ---------- menu ---------- */
  .hero { padding: var(--space-lg) 0 var(--space-xl); }
  .hero h1 { margin: 0; font-size: var(--fs-3xl); line-height: .95; letter-spacing: -0.045em; font-weight: 700; }
  .hero h1 em { font-style: normal; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: var(--space-sm) 0 0; color: var(--muted); font-size: var(--fs-lg); max-width: 34ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: var(--space-sm); }
  .card {
    --h: 290; position: relative; text-align: left; font: inherit; color: inherit; cursor: pointer;
    padding: var(--space-md); display: flex; flex-direction: column; gap: .4rem; min-height: 200px;
    animation: rise .55s var(--ease-spring) both; animation-delay: calc(var(--i) * 60ms);
    transition: transform var(--duration) var(--ease-spring), border-color var(--duration), box-shadow var(--duration);
  }
  .card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(120% 80% at 0% 0%, oklch(70% 0.15 var(--h) / 0.16), transparent 60%); pointer-events: none; }
  .card:hover { transform: translateY(-6px); border-color: oklch(72% 0.15 var(--h) / 0.55); box-shadow: 0 18px 40px oklch(60% 0.15 var(--h) / 0.25); }
  .card:active { transform: scale(0.97); }
  .card .icon { width: 56px; height: 56px; display: grid; place-items: center; font-size: 28px; border-radius: 16px; background: oklch(70% 0.15 var(--h) / 0.18); border: 1px solid oklch(72% 0.15 var(--h) / 0.3); transition: transform var(--duration) var(--ease-spring); }
  .card:hover .icon { transform: rotate(-8deg) scale(1.1); }
  .card h3 { margin: .5rem 0 0; font-size: var(--fs-lg); letter-spacing: -0.02em; }
  .card p { margin: 0; color: var(--muted); font-size: var(--fs-sm); line-height: 1.45; }
  .card .rec { margin-top: auto; padding-top: .6rem; font-size: var(--fs-xs); color: var(--muted); display: flex; gap: .4em; align-items: center; }
  .card .rec b { color: oklch(85% 0.12 var(--h)); font-weight: 700; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }

  .kings { margin-top: var(--space-xl); padding: var(--space-md); }
  .kings h2 { margin: 0 0 var(--space-sm); font-size: var(--fs-lg); letter-spacing: -0.02em; }
  .kings ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: var(--space-xs); }
  .kings li { padding: .5em 1em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-sm); }
  .kings li b { color: var(--yellow); }

  /* ---------- tela de jogo ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-md); align-items: start; }
  /* minmax(0, …): a coluna pode encolher abaixo da largura do canvas do Phaser (senão vira rolagem lateral no celular) */
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  /* Tela de jogo compacta: o jogo tem que caber na altura da tela sem rolar (senão o placar/tempo some).
     --avail (px) = altura que sobra pro #game até o fim da tela; calculada no JS (fitGame). */
  main.game-view { padding-top: var(--space-sm); padding-bottom: var(--space-sm); }
  .stage { padding: var(--space-sm) var(--space-md) var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm); }
  .stage-head { display: flex; align-items: center; gap: var(--space-sm); }
  .stage-head .title { flex: 1; min-width: 0; }
  .stage-head h2 { margin: 0; font-size: var(--fs-lg); letter-spacing: -0.03em; display: flex; align-items: center; gap: .4em; }
  .stage-head p { margin: .1rem 0 0; color: var(--muted); font-size: var(--fs-xs); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .game { --avail: 520px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); }
  .game .hud .stat { padding: .3em .85em; }
  .hud { display: flex; gap: var(--space-xs); flex-wrap: wrap; justify-content: center; }
  .stat { padding: .45em 1em; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); font-size: var(--fs-sm); color: var(--muted); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; font-size: var(--fs-base); margin-left: .25em; }
  .hint { color: var(--muted); text-align: center; margin: 0; font-size: var(--fs-sm); }

  .board { padding: var(--space-md); position: sticky; top: 80px; max-height: calc(100dvh - 96px); overflow: auto; }
  .board h3 { margin: 0 0 var(--space-sm); font-size: var(--fs-lg); letter-spacing: -0.02em; }
  .board ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .board li { display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: .5rem; padding: .55em .7em; border-radius: 12px; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .board li:nth-child(odd) { background: oklch(100% 0 0 / 0.03); }
  .board li.me { background: oklch(70% 0.19 290 / 0.18); outline: 1px solid oklch(70% 0.19 290 / 0.4); }
  .board .pos { text-align: center; color: var(--muted); }
  .board .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .empty { color: var(--muted); margin: 0; }

  .result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); animation: pop .5s var(--ease-spring); }
  .result .score { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.04em; line-height: 1; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .result .label { color: var(--muted); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .12em; }
  .badge { padding: .4em 1em; border-radius: 999px; background: oklch(86% 0.17 92 / 0.15); color: var(--yellow); border: 1px solid oklch(86% 0.17 92 / 0.35); font-weight: 700; font-size: var(--fs-sm); }
  .badge.warn { background: oklch(66% 0.22 18 / 0.15); color: oklch(82% 0.12 18); border-color: oklch(66% 0.22 18 / 0.4); max-width: 42ch; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }

  /* Reflexo */
  .reflex { width: 100%; height: clamp(150px, calc(var(--avail) - 56px), 320px); border-radius: var(--radius); display: grid; place-items: center; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em; user-select: none; cursor: pointer; text-align: center; padding: 1rem; border: 0; font-family: inherit; color: oklch(15% 0.02 275); transition: background var(--duration-fast); }
  .reflex.wait { background: var(--red); color: var(--text); }
  .reflex.go { background: var(--green); }
  .reflex.early { background: var(--yellow); }
  .reflex.between { background: var(--blue); }
  /* Clique */
  .bigbtn { width: min(240px, 70vw, calc(var(--avail) - 70px)); aspect-ratio: 1; border-radius: 50%; border: 0; font: inherit; font-size: var(--fs-lg); font-weight: 700; color: oklch(15% 0.02 275); cursor: pointer; user-select: none;
    background: radial-gradient(circle at 35% 30%, oklch(82% 0.15 35), var(--accent) 45%, var(--red)); box-shadow: 0 10px 0 oklch(45% 0.16 20), 0 24px 50px oklch(66% 0.22 18 / 0.35); transition: transform 80ms, box-shadow 80ms; }
  .bigbtn:active { transform: translateY(8px); box-shadow: 0 2px 0 oklch(45% 0.16 20), 0 10px 30px oklch(66% 0.22 18 / 0.35); }
  /* Digitação */
  .words { font-size: var(--fs-lg); line-height: 1.8; background: var(--surface-2); padding: var(--space-sm) var(--space-md); border-radius: 14px; width: 100%; min-height: 110px; border: 1px solid var(--border); }
  .words span { padding: 0 .15em; border-radius: 6px; }
  .words .cur { background: oklch(70% 0.19 290 / 0.35); outline: 1px solid var(--primary); }
  .words .ok { color: var(--green); }
  .words .bad { color: var(--red); text-decoration: line-through; }
  input.txt { font: inherit; font-size: var(--fs-lg); padding: .6em 1em; border-radius: 14px; border: 1px solid var(--border-strong); background: oklch(12% 0.02 275 / 0.7); color: var(--text); width: 100%; max-width: 440px; text-align: center; min-height: 44px; transition: border-color var(--duration), box-shadow var(--duration); }
  input.txt:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px oklch(70% 0.19 290 / 0.25); }
  input.txt.wrong { border-color: var(--red); animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  /* Memória */
  .simon { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(300px, 80vw, calc(var(--avail) - 100px)); aspect-ratio: 1; }
  .pad { border: 0; border-radius: 24px; opacity: .3; cursor: pointer; transition: opacity 90ms, transform 90ms; }
  .pad:nth-child(1) { border-top-left-radius: 50%; } .pad:nth-child(2) { border-top-right-radius: 50%; }
  .pad:nth-child(3) { border-bottom-left-radius: 50%; } .pad:nth-child(4) { border-bottom-right-radius: 50%; }
  .pad.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 40px currentColor; }
  /* Jogos em Phaser (Cobrinha, Mira): a caixa reserva o espaço antes do Phaser carregar (sem CLS) */
  .phaser-wrap { width: 100%; margin: 0 auto; display: grid; place-items: center; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #1d1f2e; touch-action: none; }
  /* contain: size → a caixa fica no tamanho calculado (largura + aspect-ratio) mesmo se o canvas
     ainda estiver no tamanho original antes do Phaser aplicar a escala */
  .phaser-wrap { contain: size; }
  .phaser-wrap canvas { display: block; cursor: crosshair; max-width: 100%; max-height: 100%; }
  .reflex, .bigbtn, .pad { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  input.txt.right { border-color: var(--green); box-shadow: 0 0 0 4px oklch(76% 0.18 150 / 0.25); }
  /* Cor Certa (Stroop) */
  .stroop-word { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.03em; line-height: 1; min-height: 1.1em; user-select: none; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(440px, 100%); }
  .choices .btn { min-height: 56px; font-size: var(--fs-base); }
  .choices kbd { font: inherit; font-size: var(--fs-xs); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 .4em; }
  .shake { animation: shake .25s; }
  /* Caça Números (Schulte) */
  .schulte { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: min(400px, 100%, calc(var(--avail) - 56px)); }
  .cell { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: var(--fs-lg); font-weight: 700; cursor: pointer; touch-action: manipulation; transition: opacity var(--duration), transform var(--duration-fast); }
  .cell:hover { border-color: var(--border-strong); }
  .cell.done { opacity: .18; transform: scale(.92); }
  .cell.miss { border-color: var(--red); animation: shake .25s; }
  .schulte.hidden .cell { color: var(--muted); opacity: .45; cursor: default; }
  .schulte-wrap { position: relative; display: grid; place-items: center; width: 100%; }
  .schulte-wrap #go { position: absolute; min-height: 56px; font-size: var(--fs-lg); padding: 0 1.75rem; box-shadow: var(--elev-3); }
  /* Toupeira */
  .moles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: min(380px, 100%, calc(var(--avail) - 100px)); }
  .hole { position: relative; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border); overflow: hidden; cursor: pointer; touch-action: manipulation; padding: 0; font: inherit;
    background: radial-gradient(ellipse at 50% 70%, oklch(10% 0.02 275) 0 45%, var(--surface-2) 46%); }
  .hole span { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(2rem, 9vw, 3rem); transform: translateY(105%); transition: transform 110ms var(--ease); pointer-events: none; }
  .hole.up span { transform: translateY(0); }
  .hole.hit { background: radial-gradient(ellipse at 50% 70%, oklch(40% 0.12 150) 0 45%, var(--surface-2) 46%); }
  .hole.boom { background: radial-gradient(ellipse at 50% 70%, oklch(45% 0.18 18) 0 45%, var(--surface-2) 46%); }
  /* 2048 */
  .g2048 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 10px; border-radius: 16px; background: var(--surface-2);
    border: 1px solid var(--border); width: min(400px, 100%, calc(var(--avail) - 90px)); aspect-ratio: 1; touch-action: none; user-select: none; }
  .g2048 .t { border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: clamp(1rem, 4.6vw, 1.9rem); background: oklch(100% 0 0 / 0.04); font-variant-numeric: tabular-nums; }
  .g2048 .t.pop { animation: pop .16s var(--ease-spring); }
  .g2048 .t.merge { animation: bump .2s var(--ease-spring); }
  @keyframes bump { 50% { transform: scale(1.14); } }
  /* Campo Minado */
  .mines { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; width: min(420px, 100%, calc(var(--avail) - 110px)); user-select: none; touch-action: manipulation; }
  .mc { aspect-ratio: 1; border: 0; border-radius: 6px; padding: 0; font: inherit; font-weight: 700; font-size: clamp(.8rem, 3.4vw, 1.2rem); cursor: pointer; color: var(--text);
    background: linear-gradient(160deg, oklch(36% 0.03 275), oklch(28% 0.03 275)); box-shadow: inset 0 -2px 0 oklch(0% 0 0 / .3); -webkit-tap-highlight-color: transparent; }
  .mc:hover { filter: brightness(1.15); }
  .mc.open { background: oklch(19% 0.02 275); box-shadow: none; cursor: default; }
  .mc.boom { background: var(--red); }

  </section>
</main>
<div class="sr-only" role="status" aria-live="polite" id="live"></div>

<script>
const $ = s => document.querySelector(s);
const main = $('#main');
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Conta logada (vem de /api/auth/me) e o resultado do bloqueio por fila do Geiko.
let me = null, gate = null, player = '';
let cleanup = null;

// ---------- placar ----------
// Aberto pelo server.js: salva no banco (SQLite). Se o envio falhar, guarda numa fila e reenvia depois.
// Aberto direto do arquivo (file://): ranking só no localStorage deste navegador.
const localMode = location.protocol === 'file:';
// começa com o ranking da última visita (mg_cache) pra desenhar o menu sem esperar a rede
let scores = localMode ? readJson('mg_scores', {}) : readJson('mg_cache', {}), online = false;
function readJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
const localScores = () => readJson('mg_scores', {});
const pending = () => readJson('mg_pending', []);
// Lança erro com .rejected = true quando o servidor recusa a pontuação (4xx): não adianta reenviar.
async function postScore(entry) {
  const r = await fetch('api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) });
  if (!r.ok) {
    const err = new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    err.rejected = r.status >= 400 && r.status < 500;
    err.status = r.status;
    throw err;
  }
}

  const queue = pending();
  while (queue.length) {
    try { await postScore(queue[0]); }
    catch (e) { if (!e.rejected) throw e; }
    queue.shift();
    localStorage.setItem('mg_pending', JSON.stringify(queue));
  }
}
async function fetchScores() {
  if (localMode) { scores = localScores(); online = false; }
  else {
    try {
      await flushPending();
      const r = await fetch('api/scores');
      if (!r.ok) throw new Error(r.status);
      scores = await r.json(); online = true;
      try { localStorage.setItem('mg_cache', JSON.stringify(scores)); } catch {}
    } catch { online = false; }
  }

  $('#db').classList.toggle('on', online);
  $('#dbtxt').textContent = localMode ? 'ranking só neste navegador'
    : online ? 'ranking compartilhado'
    : `servidor fora do ar${waiting ? ` · ${waiting} pra enviar` : ''}`;
}
function bestPerPlayer(gameId) {
  const g = GAMES[gameId];
  const best = {};
  for (const s of scores[gameId] || []) {
    if (!(s.name in best) || better(g, s.score, best[s.name])) best[s.name] = s.score;
  }
  return Object.entries(best).sort((a, b) => better(g, a[1], b[1]) ? -1 : 1);
}
function better(g, a, b) { return g.better === 'low' ? a < b : a > b; }
// Retorna 'ok' (salvou), 'queued' (servidor fora, reenvia depois) ou a mensagem de recusa do servidor.
async function saveScore(gameId, score, proof) {
  const entry = { game: gameId, player, score, proof };
  if (localMode) {
    const all = localScores();
    (all[gameId] = all[gameId] || []).push({ name: player, score, date: Date.now() });
    localStorage.setItem('mg_scores', JSON.stringify(all));
    scores = all;
    return 'ok';
  }
  try {
    await postScore(entry);
    await fetchScores();
    return 'ok';
  } catch (e) {
    // sem login (sessão expirou, ou página antiga aberta antes do login existir): guarda e salva depois de entrar
    if (e.status === 401) { unsavedScore = { gameId, score, proof }; return 'login'; }
    if (e.rejected) return e.message;
    localStorage.setItem('mg_pending', JSON.stringify([...pending(), entry]));
    // mostra no ranking local enquanto não sobe pro servidor
    (scores[gameId] = scores[gameId] || []).push({ name: player, score, date: Date.now() });
    await fetchScores();
    return 'queued';
  }
}
function fmt(g, v) { return (g.decimals ? v.toFixed(g.decimals) : v) + ' ' + g.unit; }

// ---------- som ----------
// Bipes sintetizados (Web Audio), sem arquivos. Botão 🔊 no topo liga/desliga.
let muted = localStorage.getItem('mg_mute') === '1';
let audioCtx = null;
function beep(freq, ms = 90, type = 'sine', vol = 0.07) {
  if (muted) return;
  try {
    audioCtx ??= new AudioContext();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t + ms / 1000);
  } catch {}
}
const sfx = {
  good: () => beep(880, 70, 'triangle'),
  bad: () => beep(130, 220, 'sawtooth', 0.05),
  record: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 140, 'triangle'), i * 90)),
};
function renderMute() {
  $('#mute').textContent = muted ? '🔇' : '🔊';
  $('#mute').setAttribute('aria-label', muted ? 'Ligar som' : 'Desligar som');
}

// ---------- Phaser ----------
// ~1 MB: só baixa quando alguém abre a Cobrinha ou a Mira (no menu, fica pré-buscado em segundo plano).
const PHASER_URL = 'https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js';
let phaserLoading = null;
function loadPhaser() {
  return phaserLoading ??= new Promise((resolve, reject) => {
    if (window.Phaser) return resolve();
    const s = document.createElement('script');
    s.src = PHASER_URL;
    s.onload = resolve;
    s.onerror = () => { phaserLoading = null; s.remove(); reject(new Error('Não deu pra carregar o Phaser. Confere a internet e tenta de novo.')); };
    document.head.append(s);

}
function prefetchPhaser() {

  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 1500));

// Cria o jogo dentro de `wrap` (que já reserva o espaço). Retorna a função de limpeza.
// O tamanho na tela encolhe pra caber na largura E na altura que sobram (placar e dicas continuam visíveis).
function mountPhaser(wrap, width, height, scene) {
  let game = null, dead = false;
  wrap.style.maxWidth = width + 'px';
  wrap.style.aspectRatio = `${width} / ${height}`;
  wrap.innerHTML = '<p class="hint">Carregando...</p>';
  const size = () => {
    const box = wrap.parentElement, cs = getComputedStyle(box);
    const gap = parseFloat(cs.rowGap) || 0;
    const others = [...box.children].filter(c => c !== wrap).reduce((sum, c) => sum + c.offsetHeight + gap, 0);
    const maxH = (parseFloat(cs.getPropertyValue('--avail')) || height) - others;
    const scale = Math.max(0.35, Math.min(1, box.clientWidth / width, maxH / height));
    // !important: nada (CSS do layout, Phaser) pode esticar a caixa além do tamanho calculado
    wrap.style.setProperty('width', Math.floor(width * scale) + 'px', 'important');
    wrap.style.setProperty('height', Math.floor(height * scale) + 'px', 'important');
    game?.scale.refresh();
  };
  size();
  addEventListener('mg:fit', size);
  loadPhaser().then(() => {
    if (dead) return;
    wrap.innerHTML = '';
    game = new Phaser.Game({
      type: Phaser.AUTO, parent: wrap, width, height, backgroundColor: '#1d1f2e', banner: false,
      audio: { noAudio: true },
      // expandParent: false — senão o Phaser às vezes troca a altura da caixa pra 100% e o jogo estoura a tela
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
      scene,
    });
  }).catch(e => { if (!dead) wrap.innerHTML = `<p class="hint">⚠️ ${esc(e.message)}</p>`; });

}
// Altura que sobra pro #game até o fim da tela (com a página no topo) → variável CSS --avail.
// Os jogos em HTML usam no CSS; os em Phaser, no mountPhaser (evento mg:fit).
function fitGame() {
  const el = $('#game');
  if (!el) return;
  const top = el.getBoundingClientRect().top + scrollY;

}
let fitTimer = 0;
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitGame, 120); });
// Cor CSS (inclusive oklch) → número 0xRRGGBB que o Phaser entende.
function hex(cssVar) {

}
// Textura de pontinho branco pras partículas (pintada com `tint`).
function dotTexture(scene) {

}

  const t = scene.add.text(x, y, text, { fontFamily: 'Space Grotesk, system-ui, sans-serif', fontSize: '22px', fontStyle: 'bold', color }).setOrigin(0.5);
  scene.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 650, ease: 'Cubic.Out', onComplete: () => t.destroy() });
}

// ---------- jogos ----------
const GAMES = {
  reflexo: {
    name: 'Reflexo', emoji: '⚡', hue: 92, desc: 'Clique (ou Espaço) quando ficar verde. Média de 3 rodadas. Clicou antes? Recomeça do zero!',
    better: 'low', unit: 'ms',
    start(el, done) {
      let times = [], timer, startAt, state;
      el.innerHTML = '<div class="hud"><span class="stat">Rodada<b id="rd"></b></span></div><button class="reflex" id="rx"></button>';
      const box = el.querySelector('#rx');
      const set = (cls, txt) => { box.className = 'reflex ' + cls; box.textContent = txt; };
      function wait() {
        state = 'wait';

        if (state === 'wait') early('Cedo demais!');
        else if (state === 'early') { if (performance.now() >= lockedUntil) wait(); }
        else if (state === 'go') {
          times.push(Math.round(performance.now() - startAt));

    }
  },
  clique: {
    name: 'Clique Maluco', emoji: '👆', hue: 20, desc: 'Quantos cliques você dá em 10 segundos?',
    better: 'high', unit: 'cliques',
    // Mesma regra do server.js (cheatReason). Retorna o motivo se parecer autoclicker.
    check(score, proof) {
      if (score > 200) return 'cliques demais pra um humano';
      if (proof.length >= 50) {
        const mean = proof.reduce((a, b) => a + b, 0) / proof.length;
        const sd = Math.sqrt(proof.reduce((a, b) => a + (b - mean) ** 2, 0) / proof.length);

    },
    start(el, done) {

      el.innerHTML = '<div class="hud"><span class="stat">Cliques<b id="n">0</b></span><span class="stat">Tempo<b id="t">10.0s</b></span></div><button class="bigbtn" id="b">CLIQUE<br>PRA COMEÇAR</button>';
      const b = el.querySelector('#b');

        if (!t0) {
          t0 = performance.now(); b.innerHTML = 'CLIQUE!';
          iv = setInterval(() => {
            const left = 10 - (performance.now() - t0) / 1000;
            el.querySelector('#t').textContent = Math.max(0, left).toFixed(1) + 's';
            if (left <= 0) { clearInterval(iv); done(n, gaps); }
          }, 50);
        }
        const now = performance.now();
        if (last) gaps.push(Math.round(now - last));
        last = now;
        el.querySelector('#n').textContent = ++n;
      };
      return () => clearInterval(iv);
    }
  },
  digitacao: {
    name: 'Digitação', emoji: '⌨️', hue: 245, desc: 'Digite o máximo de palavras certas em 30s.',
    better: 'high', unit: 'palavras',
    start(el, done) {
      const pool = 'casa café reunião planilha email chefe projeto prazo cliente sistema relatório banana janela teclado monitor cadeira trabalho sexta feira almoço tarefa pessoa código servidor rede mouse papel caneta agenda equipe meta ideia gato cachorro sol chuva verde azul rápido lento grande pequeno feliz carro mesa porta livro música filme jogo'.split(' ');
      const words = Array.from({ length: 120 }, () => pool[rand(0, pool.length - 1)]);
      let i = 0, ok = 0, t0 = 0, iv; const res = [];
      el.innerHTML = '<div class="hud"><span class="stat">Certas<b id="ok">0</b></span><span class="stat">Tempo<b id="t">30s</b></span></div><div class="words" id="w"></div><input class="txt" id="in" placeholder="comece a digitar..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Digite as palavras">';
      const w = el.querySelector('#w'), inp = el.querySelector('#in');
      function render() {
        const from = Math.max(0, i - 4);

        lastLane = lane;
        t += beat * (t > 8000 && Math.random() < 0.3 ? 0.5 : 1);
      }
      const end = notes.at(-1).t + 900;
      return mountPhaser(el.querySelector('#pw'), W, H, {
        create() {
          let now = 0, score = 0, combo = 0, over = false;
          const pressed = [0, 0, 0, 0];
          const g = this.add.graphics();
          const font = { fontFamily: 'Space Grotesk, system-ui, sans-serif', fontSize: '18px', color: '#9aa0b4' };
          ['D', 'F', 'J', 'K'].forEach((k, i) => this.add.text(i * LW + LW / 2, HIT_Y + 40, k, font).setOrigin(0.5));
          const judge = (text, color, lane) => floatText(this, lane * LW + LW / 2, HIT_Y - 30, text, color);
          const mult = () => Math.min(4, 1 + Math.floor(combo / 10) * 0.5);
          const press = lane => {
            if (over) return;
            pressed[lane] = 120;
            let best = null;
            for (const n of notes) if (!n.done && n.lane === lane && Math.abs(n.t - now) <= GOOD && (!best || Math.abs(n.t - now) < Math.abs(best.t - now))) best = n;
            if (!best) {
              // apertar sem nota quebra o combo (senão compensava metralhar as teclas)
              if (combo) judge('Errou', '#ff6b8a', lane);
              combo = 0; hud.c.textContent = 0;
              return;
            }
            best.done = true;
            const perfect = Math.abs(best.t - now) <= PERFECT;
            combo++;
            score += Math.round((perfect ? 100 : 50) * mult());
            hud.p.textContent = score; hud.c.textContent = combo;
            judge(perfect ? 'Perfeito' : 'Bom', perfect ? '#ffd34d' : '#7cffb0', lane);
            beep(TONES[lane] * (perfect ? 2 : 1), 90, 'triangle', 0.05);
          };
          const KEY_LANE = { d: 0, f: 1, j: 2, k: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
          this.input.keyboard.addCapture('LEFT,RIGHT,UP,DOWN');
          this.input.keyboard.on('keydown', e => {
            const lane = KEY_LANE[e.key.length === 1 ? e.key.toLowerCase() : e.key];
            if (lane !== undefined && !e.repeat) press(lane);
          });
          this.input.on('pointerdown', p => press(Phaser.Math.Clamp(Math.floor(p.x / LW), 0, LANES - 1)));
          this.events.on('update', (time, delta) => {
            if (!over) {
              now += Math.min(delta, 50);
              hud.t.textContent = Math.max(0, Math.ceil((DUR - now) / 1000)) + 's';
              for (const n of notes) if (!n.done && now - n.t > GOOD) {
                n.done = true;
                if (combo) judge('Perdeu', '#ff6b8a', n.lane);
                combo = 0; hud.c.textContent = 0;
              }
              if (now > end) { over = true; this.time.delayedCall(400, () => done(score)); }
            }
            for (let i = 0; i < LANES; i++) pressed[i] = Math.max(0, pressed[i] - delta);
            g.clear();
            for (let i = 0; i < LANES; i++) {
              g.fillStyle(i % 2 ? 0x1d1f2e : 0x22253a).fillRect(i * LW, 0, LW, H);
              if (pressed[i]) g.fillStyle(laneColor[i], 0.18 * (pressed[i] / 120)).fillRect(i * LW, 0, LW, H);
            }
            g.fillStyle(0xffffff, 0.55).fillRect(0, HIT_Y - 2, W, 4);
            for (let i = 0; i < LANES; i++) g.lineStyle(2, laneColor[i], 0.7).strokeRoundedRect(i * LW + 10, HIT_Y - 12, LW - 20, 24, 8);
            for (const n of notes) {
              if (n.done) continue;
              const y = HIT_Y - ((n.t - now) / TRAVEL) * (HIT_Y + 20);
              if (y < -30 || y > H) continue;
              g.fillStyle(laneColor[n.lane]).fillRoundedRect(n.lane * LW + 12, y - 10, LW - 24, 20, 8);
            }
          });
        },
      });
    }
  },
  anagrama: {
    name: 'Anagrama', emoji: '🔤', hue: 60, desc: 'Desembaralhe as palavras em 60s. Digite e Enter (ou clique nas letras). Palavra maior vale mais. Pular não custa ponto.',
    better: 'high', unit: 'pontos',
    start(el, done) {
      const WORDS = ('AMIGO BANANA CABELO CADEIRA CAMISA CANETA CARRO CAVALO CHAVE CINEMA COELHO COMIDA CORAGEM CORRIDA DESENHO DINHEIRO DOMINGO ESCOLA ESPELHO ESTRELA '
        + 'FAMILIA FESTA FLORESTA FORMIGA FUTEBOL GALINHA GARRAFA GELADO GIRAFA GUITARRA HOSPITAL JANELA JARDIM LARANJA LIVRO MACACO MALETA MANTEIGA MARTELO MOCHILA '
        + 'MONITOR MORANGO MOTOR NAVIO OVELHA PANELA PAPEL PEPINO PERFUME PIJAMA PIMENTA PINCEL PIPOCA PLANETA PORTA PRAIA PRESENTE PRINCESA QUEIJO SABONETE SAPATO '
        + 'SEGREDO SORVETE TAPETE TECLADO TELHADO TESOURA TIGRE TOMATE TRABALHO TRATOR VENTO VIAGEM VIOLINO ABACAXI ALFACE ANIMAL BALEIA BARCO BATATA BICICLETA BONECA '
        + 'CAMELO CEBOLA CENOURA CHOCOLATE CIDADE COLHER CORUJA DENTISTA ELEFANTE ESCADA FOGUETE FRANGO GATINHO GOLFINHO LAGARTO MELANCIA MERCADO MOEDA NUVEM PALAVRA '
        + 'PEIXE PIRATA PLANTA POLVO QUADRO RAPOSA SALADA SERPENTE SOLDADO TARTARUGA TELEFONE URSO VAMPIRO VASSOURA ZEBRA').split(' ');
      const sorted = w => [...w].sort().join('');
      const DUR = 60;
      const deck = [...WORDS].sort(() => Math.random() - 0.5);
      let word = '', pts = 0, solved = 0, t0 = 0, iv, over = false;
      el.innerHTML = `<div class="hud"><span class="stat">Pontos<b id="p">0</b></span><span class="stat">Palavras<b id="w">0</b></span><span class="stat">Tempo<b id="t">60s</b></span></div>
        <div class="tiles" id="tiles"></div>
        <input class="txt" id="in" placeholder="digite a palavra + Enter" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Palavra">
        <div class="row-btns"><button class="btn ghost" id="clr">⌫ Apagar</button><button class="btn ghost" id="skip">Pular ⏭</button></div>`;
      const inp = el.querySelector('#in'), tilesEl = el.querySelector('#tiles');
      const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z]/g, '');
      const syncTiles = () => {
        // marca como usadas as letras que já estão digitadas
        const typed = [...norm(inp.value)];
        tilesEl.querySelectorAll('.tile').forEach(t => {
          const k = typed.indexOf(t.dataset.l);
          t.classList.toggle('used', k >= 0);
          if (k >= 0) typed.splice(k, 1);
        });
      };
      const next = () => {
        word = deck.pop() || WORDS[rand(0, WORDS.length - 1)];
        let mix;
        do mix = [...word].sort(() => Math.random() - 0.5).join(''); while (mix === word);
        tilesEl.innerHTML = [...mix].map(l => `<button class="tile" data-l="${l}">${l}</button>`).join('');
        tilesEl.querySelectorAll('.tile').forEach(t => t.onclick = () => { startClock(); inp.value += t.dataset.l; syncTiles(); inp.focus(); });
        inp.value = '';
      };
      const startClock = () => {
        if (t0) return;
        t0 = performance.now();
        iv = setInterval(() => {
          const left = DUR - (performance.now() - t0) / 1000;
          el.querySelector('#t').textContent = Math.max(0, Math.ceil(left)) + 's';
          if (left <= 0 && !over) { over = true; clearInterval(iv); inp.disabled = true; done(pts); }
        }, 100);
      };
      const submit = () => {
        if (over) return;
        const guess = norm(inp.value);
        if (!guess) return;
        startClock();
        // vale qualquer palavra da lista com as mesmas letras (ex.: outra ordem válida)
        if (sorted(guess) === sorted(word) && WORDS.includes(guess)) {
          pts += word.length; solved++;
          el.querySelector('#p').textContent = pts; el.querySelector('#w').textContent = solved;
          sfx.good();
          next();
        } else {
          beep(160, 120, 'square', 0.03);
          inp.classList.remove('wrong'); void inp.offsetWidth; inp.classList.add('wrong');
        }
      };
      inp.oninput = () => { startClock(); syncTiles(); };
      inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
      el.querySelector('#clr').onclick = () => { inp.value = ''; syncTiles(); inp.focus(); };
      el.querySelector('#skip').onclick = () => { if (over) return; startClock(); beep(300, 50, 'sine', 0.02); next(); inp.focus(); };
      next();
      inp.focus();
      return () => { over = true; clearInterval(iv); };
    }
  }
};

// ---------- telas ----------
function stop() { if (cleanup) { cleanup(); cleanup = null; } }
function swap(render) {
  if (document.startViewTransition && !reduced) document.startViewTransition(render);
  else render();
}
function announce(msg) { $('#live').textContent = msg; }

function champions() {
  const count = {};
  for (const id in GAMES) { const top = bestPerPlayer(id)[0]; if (top) count[top[0]] = (count[top[0]] || 0) + 1; }
  return Object.entries(count).sort((a, b) => b[1] - a[1]);
}

function recHtml(id) {
  const g = GAMES[id], top = bestPerPlayer(id)[0];
  return top ? `🏆 <b>${esc(top[0])}</b> · ${fmt(g, top[1])}` : 'Sem recorde ainda — seja o primeiro';
}
function kingsHtml() {
  const kings = champions();
  return '<h2>👑 Quem manda no escritório</h2>' + (kings.length
    ? '<ol>' + kings.map(([n, c], k) => `<li>${['🥇', '🥈', '🥉'][k] || '•'} ${esc(n)} — <b>${c}</b> ${c > 1 ? 'recordes' : 'recorde'}</li>`).join('') + '</ol>'
    : '<p class="hint" style="text-align:left">Ninguém tem recorde ainda.</p>');
}
// Desenha o menu na hora com o ranking que já temos (cache da última visita) — não espera a API (LCP).
// Reaproveita o .hero que veio no HTML: recriar o maior elemento da tela contaria como um LCP novo (mais tarde).
const heroNode = main.querySelector('.hero');
// Jogos em destaque aparecem primeiro no menu; o resto segue a ordem do GAMES.
const FEATURED = ['blocos'];
const menuOrder = () => [...FEATURED, ...Object.keys(GAMES).filter(id => !FEATURED.includes(id))].map(id => [id, GAMES[id]]);
function renderMenu() {
  main.classList.remove('game-view');
  main.replaceChildren(heroNode);
  main.insertAdjacentHTML('beforeend', `
    <section class="gate glass" id="gate" hidden aria-live="polite"></section>
    <section class="grid" aria-label="Jogos">` +
    menuOrder().map(([id, g], i) => `<button class="card glass" data-id="${id}" style="--h:${g.hue};--i:${i}">
        <span class="icon" aria-hidden="true">${g.emoji}</span>
        <h3>${g.name}</h3><p>${g.desc}</p>
        <span class="rec">${recHtml(id)}</span>
      </button>`).join('') + `</section>
    <section class="kings glass" id="kings">${kingsHtml()}</section>`);
  main.querySelectorAll('.card').forEach(c => c.onclick = () => play(c.dataset.id));
  renderGate();
  prefetchPhaser();
}
// Quando o ranking novo chega, só troca os textos (sem redesenhar nem reanimar os cards).
function refreshMenu() {
  if (!$('#kings')) return;
  for (const id in GAMES) { const rec = $(`.card[data-id="${id}"] .rec`); if (rec) rec.innerHTML = recHtml(id); }
  $('#kings').innerHTML = kingsHtml();
}

async function showMenu() {
  stop();
  const changed = currentView !== 'menu';
  currentView = 'menu';
  if (changed) setTimeout(pingSession, 0);
  swap(renderMenu);
  await fetchScores();
  if (currentView === 'menu') refreshMenu();
  checkVersion();
  if (me && !me.mustChange) refreshGate();
}

function boardHtml(id) {
  const g = GAMES[id], rows = bestPerPlayer(id).slice(0, 10);
  return `<h3>🏆 Ranking</h3>` + (rows.length
    ? '<ol>' + rows.map(([n, s], k) => `<li class="${n === player ? 'me' : ''}"><span class="pos">${['🥇', '🥈', '🥉'][k] || k + 1}</span><span class="name">${esc(n)}</span><span>${fmt(g, s)}</span></li>`).join('') + '</ol>'
    : '<p class="empty">Ninguém jogou ainda.</p>');
}

function play(id) {
  if (!localMode && !me) return loginModal();
  if (me?.mustChange) return passwordModal(true);
  if (gate?.blocked) return gateDialog();
  stop();
  currentView = id;
  setTimeout(pingSession, 0); // avisa o painel "online" que trocou de jogo
  const g = GAMES[id];
  swap(() => {
    main.innerHTML = `<div class="layout">
      <section class="stage glass" style="--h:${g.hue}">
        <div class="stage-head">
          <button class="btn ghost" id="back" aria-label="Voltar ao menu">←</button>
          <div class="title"><h2><span aria-hidden="true">${g.emoji}</span>${g.name}</h2><p>${g.desc}</p></div>
          <button class="btn ghost" id="restart">↻ Reiniciar</button>
        </div>
        <div class="game" id="game"></div>
      </section>
      <aside class="board glass" id="board">${boardHtml(id)}</aside>
    </div>`;
    $('#back').onclick = showMenu;
    $('#restart').onclick = () => play(id);
    fetchScores().then(() => $('#board') && ($('#board').innerHTML = boardHtml(id)));
    main.classList.add('game-view');
    window.scrollTo(0, 0);
    fitGame();
    const el = $('#game');
    cleanup = g.start(el, async (score, proof) => {
      stop();
      // done(null, 'motivo'): partida acabou sem pontuação (ex.: explodiu no Campo Minado) — nada é salvo
      if (score === null) {
        el.innerHTML = `<div class="result"><span class="label">Fim de jogo</span><span class="score">💥</span>
          <span class="hint">${esc(proof || 'Não completou — nada foi salvo.')}</span><button class="btn" id="again">Jogar de novo</button></div>`;
        $('#again').onclick = () => play(id);
        $('#again').focus();
        return;
      }
      const prev = bestPerPlayer(id).find(([n]) => n === player);
      const cheat = g.check?.(score, proof);
      const status = cheat || await saveScore(id, score, proof);
      const ok = status === 'ok' || status === 'queued';
      const record = ok && (!prev || better(g, score, prev[1]));
      const top = bestPerPlayer(id)[0];
      const champ = record && top && top[0] === player && top[1] === score;
      $('#board').innerHTML = boardHtml(id);
      el.innerHTML = `<div class="result">
        <span class="label">Resultado</span>
        <span class="score">${fmt(g, score)}</span>
        ${status === 'login' ? '<span class="badge warn">🔑 Você não estava logado — entre pra salvar este resultado.</span><button class="btn" id="loginSave">Entrar e salvar</button>'
          : !ok ? `<span class="badge warn">🤖 Não valeu: ${esc(status)}. Resultado não foi salvo.</span>`
          : champ ? '<span class="badge">👑 Recorde geral!</span>'
          : record ? '<span class="badge">🎉 Novo recorde pessoal!</span>'
          : prev ? `<span class="hint">Seu recorde: ${fmt(g, prev[1])}</span>` : ''}
        ${status === 'queued' ? '<span class="badge warn">⚠️ Servidor fora do ar — resultado guardado, envio automático quando ele voltar</span>' : ''}
        <button class="btn" id="again">Jogar de novo</button>
      </div>`;
      announce(`Resultado: ${fmt(g, score)}. ${!ok ? 'Não foi salvo.' : record ? 'Novo recorde!' : ''}`);
      if (record) { confetti(); sfx.record(); }
      $('#again').onclick = () => play(id);
      $('#again').focus();
      $('#loginSave')?.addEventListener('click', () => { setMe(null); loginModal(); });
    });
  });
}

function confetti() {
  if (reduced) return;
  const colors = ['--primary', '--accent', '--yellow', '--green', '--blue'].map(css);
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() * 240 - 120) + 'px');
    c.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    c.style.animationDuration = 1.6 + Math.random() * 1.2 + 's';
    c.style.animationDelay = Math.random() * .25 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}

// ---------- conta: login, senha, menu ----------
// Chamada à API em JSON. Lança Error com a mensagem do servidor (e .status) quando não dá certo.
async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch(path, { method, headers: body !== undefined ? { 'Content-Type': 'application/json' } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && j.reason === 'other-device') kicked(j.error);
  if (!r.ok) throw Object.assign(new Error(j.error || `Erro ${r.status}`), { status: r.status, reason: j.reason });
  return j;
}

// Uma conta = um aparelho: se alguém logou com esta conta em outro lugar, este aparelho sai na hora.
function kicked(msg) {
  if (!me) return;
  stop();
  setMe(null); gate = null;
  showMenu();
  loginModal(msg || 'Sua conta entrou em outro dispositivo — só dá pra usar em um por vez.');
}
async function pingSession() {
  if (!me || document.hidden) return;
  try {
    const { block } = await api('api/auth/ping?view=' + encodeURIComponent(currentView === 'records' ? 'admin' : currentView));
    // admin bloqueou (ou liberou): atualiza; se estava jogando, encerra a partida
    if (!!block !== !!gate?.manual) {
      const playing = GAMES[currentView];
      await refreshGate(true);
      if (block && playing) { stop(); showMenu(); gateDialog(); }
    }
  }
  catch (err) { if (err.status === 401) kicked(err.reason === 'other-device' ? err.message : 'Sua sessão expirou. Entre de novo.'); }
}
setInterval(pingSession, 20_000);
addEventListener('visibilitychange', () => { if (!document.hidden) pingSession(); });

// Janela modal genérica. `locked` = não fecha com Esc/clique fora (login e troca de senha obrigatória).
function modal(html, { locked = false, wide = false } = {}) {
  $('.modal')?.remove();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="box glass${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  if (!locked) {
    m.addEventListener('click', e => { if (e.target === m) close(); });
    m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  }
  m.querySelector('input, button')?.focus();
  return { el: m, close };
}

function setMe(user) {
  me = user;
  player = user?.name || '';
  $('#pname').textContent = player || '—';
  $('#mAdmin').hidden = user?.role !== 'admin';
  $('#mRecords').hidden = !user?.canEditRecords;
}

function loginModal(msg = '') {
  const { el, close } = modal(`
    <h2>Entrar</h2><p>Use o usuário e a senha que o admin te passou. Cada conta funciona em um aparelho por vez — entrar aqui desconecta os outros.</p>
    <form id="lf">
      <input class="txt" name="username" autocomplete="username" placeholder="usuário" aria-label="Usuário" required>
      <input class="txt" name="password" type="password" autocomplete="current-password" placeholder="senha" aria-label="Senha" required>
      <p class="err" id="lerr">${esc(msg)}</p>
      <button class="btn">Entrar</button>
    </form>`, { locked: true });
  el.querySelector('#lf').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), btn = e.target.querySelector('button');
    btn.disabled = true; el.querySelector('#lerr').textContent = '';
    try {
      const { user } = await api('api/auth/login', { method: 'POST', body: { username: f.get('username'), password: f.get('password') } });
      close();
      await afterLogin(user);
    } catch (err) {
      el.querySelector('#lerr').textContent = err.message;
      btn.disabled = false;
    }
  };
}

function passwordModal(forced) {
  const { el, close } = modal(`
    <h2>${forced ? 'Crie sua senha' : 'Trocar senha'}</h2>
    <p>${forced ? 'Primeiro acesso: troque a senha temporária por uma sua.' : 'Mínimo de 8 caracteres.'}</p>
    <form id="pf">
      <input class="txt" name="current" type="password" autocomplete="current-password" placeholder="${forced ? 'senha temporária' : 'senha atual'}" required>
      <input class="txt" name="next" type="password" autocomplete="new-password" placeholder="nova senha (mín. 8)" minlength="8" required>
      <input class="txt" name="again" type="password" autocomplete="new-password" placeholder="repita a nova senha" required>
      <p class="err" id="perr"></p>
      <button class="btn">Salvar senha</button>
      ${forced ? '' : '<button type="button" class="btn ghost" id="pcancel">Cancelar</button>'}
    </form>`, { locked: forced });
  el.querySelector('#pcancel')?.addEventListener('click', close);
  el.querySelector('#pf').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (f.get('next') !== f.get('again')) return (el.querySelector('#perr').textContent = 'As senhas novas não batem.');
    try {
      const { user } = await api('api/auth/password', { method: 'POST', body: { current: f.get('current'), next: f.get('next') } });
      close();
      setMe(user);
      if (forced) { await saveUnsaved(); await refreshGate(); showMenu(); }
    } catch (err) { el.querySelector('#perr').textContent = err.message; }
  };
}

// Partida que terminou sem login e ficou esperando: depois de entrar, salva na conta.
let unsavedScore = null;
async function saveUnsaved() {
  if (!unsavedScore || !me || me.mustChange) return;
  const { gameId, score, proof } = unsavedScore;
  unsavedScore = null;
  const status = await saveScore(gameId, score, proof);
  const g = GAMES[gameId];
  modal(`<h2>${status === 'ok' || status === 'queued' ? '✅ Resultado salvo' : '⚠️ Não deu pra salvar'}</h2>
    <p>${g.name}: <b>${fmt(g, score)}</b>${status === 'ok' || status === 'queued' ? ' — já está no ranking.' : ' — ' + esc(status)}</p>
    <button class="btn" onclick="this.closest('.modal').remove()">Ok</button>`);
}

async function afterLogin(user) {
  setMe(user);
  if (user.mustChange) return passwordModal(true);
  await saveUnsaved();
  await refreshGate();
  showMenu();
}

async function logout() {
  await api('api/auth/logout', { method: 'POST', body: {} }).catch(() => {});
  setMe(null); gate = null;
  stop(); showMenu();
  loginModal();
}

// ---------- bloqueio por fila do Geiko ----------
async function refreshGate(force = false) {
  if (!me || me.mustChange) return (gate = null);
  try { gate = await api('api/gate' + (force ? '?force=1' : '')); } catch { /* sem rede: mantém o último */ }
  if (currentView === 'menu') renderGate();
  return gate;
}

const fmtW = n => String(n).replace('.', ',');
// "até 14:30", "até 16/10 09:00" ou "até o admin liberar"
function untilText(ms) {
  if (!ms || ms > 1e15) return 'até o admin liberar';
  const d = new Date(ms), today = new Date().toDateString() === d.toDateString();
  return 'até ' + (today ? '' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ') + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function gateHtml() {
  if (gate?.manual) {
    return `<div class="msg"><b>🔒 Jogos bloqueados pelo admin</b>
      <p>Bloqueado ${untilText(gate.manual.until)}.${gate.manual.reason ? ` Motivo: ${esc(gate.manual.reason)}` : ''}</p></div>
      <button class="btn ghost" id="gateRefresh">↻ Atualizar</button>`;
  }
  if (!gate || !gate.linked || !gate.enabled) return '';
  const pct = Math.min(100, gate.limit ? (gate.total / gate.limit) * 100 : 100);
  return `<div class="msg">
      <b>${gate.blocked ? '🔒 Jogos bloqueados' : '✅ Liberado pra jogar'}</b>
      <p>${gate.error ? esc(gate.error) : `Sua fila no Geiko soma <b>${fmtW(gate.total)}</b> pontos — o limite é ${fmtW(gate.limit)}. ${gate.blocked ? 'Resolva os tickets pra liberar.' : ''}`}</p>
      <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
    </div>
    <button class="btn ghost" id="gateSee">Ver tickets</button>
    <button class="btn ghost" id="gateRefresh">↻ Atualizar</button>`;
}
function renderGate() {
  const box = $('#gate');
  if (box) {
    const html = gateHtml();
    box.hidden = !html;
    box.className = `gate glass ${gate?.blocked ? 'blocked' : 'ok'}`;
    box.innerHTML = html;
    $('#gateSee')?.addEventListener('click', () => gateDialog());
    $('#gateRefresh')?.addEventListener('click', async e => { e.target.disabled = true; await refreshGate(true); });
  }
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('locked', !!gate?.blocked));
}

function ticketsTable(tickets) {
  if (!tickets.length) return '<p class="hint" style="text-align:left">Nenhum ticket aberto. 🎉</p>';
  return `<div class="scroll"><table class="tickets"><thead><tr><th>Ticket</th><th>Prioridade</th><th>Status</th><th style="text-align:right">Peso</th></tr></thead><tbody>
    ${tickets.map(t => `<tr><td>#${t.id}${t.reason ? `<br><span class="tag">${esc(t.reason)}</span>` : ''}</td><td>${esc(t.priority)}</td><td>${esc(t.status)}</td><td class="w">${fmtW(t.weight)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function gateDialog() {
  if (!gate) return;
  if (gate.manual) {
    const { el, close } = modal(`<h2>🔒 Jogos bloqueados</h2>
      <p>O admin bloqueou seus jogos ${untilText(gate.manual.until)}.</p>
      ${gate.manual.reason ? `<p><b>Motivo:</b> ${esc(gate.manual.reason)}</p>` : ''}
      <button class="btn" id="gclose">Ok</button>`);
    return (el.querySelector('#gclose').onclick = close);
  }
  const { el, close } = modal(`
    <h2>${gate.blocked ? '🔒 Fila cheia' : 'Sua fila no Geiko'}</h2>
    <p>Cada ticket tem um peso: sem prioridade ou sem interação pesa mais; aguardando o cliente pesa menos.
      Soma atual <b>${fmtW(gate.total)}</b>, limite <b>${fmtW(gate.limit)}</b>.</p>
    ${ticketsTable(gate.tickets)}
    <button class="btn" id="gclose">Fechar</button>`, { wide: true });
  el.querySelector('#gclose').onclick = close;
}

// ---------- quem está online ----------
const ago = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}`; };
const viewLabel = v => GAMES[v] ? `🎮 jogando <b>${GAMES[v].emoji} ${GAMES[v].name}</b>` : v === 'admin' ? '⚙️ no painel admin' : '🏠 no menu';
async function loadOnline() {
  const box = $('#onlineList');
  if (!box) return;
  try {
    const { now, online, recent } = await api('api/admin/online');
    $('#onCount').textContent = `· ${online.length} ${online.length === 1 ? 'pessoa' : 'pessoas'}`;
    box.innerHTML = (online.length
      ? `<table class="tickets users"><tbody>${online.map(p => `<tr data-id="${p.id}">
          <td><b>${esc(p.name)}</b>${p.id === me.id ? ' <span class="tag">• você</span>' : ''}${p.block ? ` <span class="tag" style="color:var(--red)">• 🔒 ${untilText(p.block.until)}</span>` : ''}</td>
          <td>${viewLabel(p.view)} <span class="hint">há ${ago(now - p.since)}</span></td>
          <td><div class="actions">${p.id === me.id ? '' : p.block ? '<button class="btn ghost" data-act="unblock">🔓 Desbloquear</button>' : '<button class="btn ghost" data-act="block">🔒 Bloquear</button>'}</div></td>
        </tr>`).join('')}</tbody></table>`
      : '<p class="hint" style="text-align:left">Ninguém online agora.</p>')
      + (recent.length ? `<p class="note" style="margin:var(--space-sm) 0 0">Visto nas últimas 24h: ${recent.map(p =>
          `${esc(p.name)} <span class="hint">(${new Date(p.lastSeen).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}${GAMES[p.view] ? ', ' + GAMES[p.view].name : ''})</span>`).join(' · ')}</p>` : '');
    box.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      await userAction(b.dataset.act, online.find(p => p.id === +b.closest('tr').dataset.id));
    });
  } catch (err) { box.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

let recData = { records: [], users: [] };
async function loadRecords(msg = '') {
  try {
    const [{ records }, { users }] = await Promise.all([api('api/admin/records'), api('api/admin/users')]);
    recData = { records, users: users.filter(u => u.active) };
    recState.userId ??= recData.users[0]?.id ?? null;
    renderRecords();
    if (msg) $('#recMsg').textContent = msg;
  } catch (err) { $('#recTable') && ($('#recTable').innerHTML = `<p class="err">${esc(err.message)}</p>`); }
}

function renderRecords() {
  const box = $('#recTable');
  if (!box) return;
  $('#recMsg').textContent = '';
  const pick = $('#recPick');
  const unitOf = id => `<span class="hint">${GAMES[id].unit}</span>`;
  const valueInput = (v, enabled = true) => `<input type="number" step="any" min="0" class="rec-v" value="${v ?? ''}" ${enabled ? '' : 'disabled'} style="width:8em">`;
  if (recState.mode === 'game') {
    $('#recPickName').textContent = 'Jogo';
    pick.innerHTML = menuOrder().map(([id, g]) => `<option value="${id}" ${id === recState.game ? 'selected' : ''}>${g.emoji} ${g.name}</option>`).join('');
    const g = GAMES[recState.game];
    const rows = recData.records.filter(r => r.game === recState.game).sort((a, b) => (better(g, a.best, b.best) ? -1 : 1));
    const have = new Set(rows.map(r => r.userId));
    const free = recData.users.filter(u => !have.has(u.id));
    box.innerHTML = `<table class="tickets users"><thead><tr><th>#</th><th>Pessoa</th><th>Recorde</th><th>Partidas</th><th></th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr data-game="${recState.game}" data-user="${r.userId ?? ''}" data-name="${esc(r.name)}">
        <td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${esc(r.name)}${r.userId == null ? ' <span class="tag">• sem conta</span>' : ''}</td>
        <td>${valueInput(r.best, r.userId != null)} ${unitOf(recState.game)}</td><td>${r.count}</td>
        <td><div class="actions">${r.userId != null ? '<button class="btn ghost" data-act="save">Salvar</button>' : ''}<button class="btn ghost" data-act="del">Apagar</button></div></td></tr>`).join('')
        || '<tr><td colspan="5" class="hint">Ninguém tem recorde nesse jogo ainda.</td></tr>'}
      </tbody></table>
      ${free.length ? `<div class="row" style="margin-top:var(--space-sm)" data-game="${recState.game}">
        <label>Adicionar recorde pra<select class="rec-u">${free.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label>
        <label>Valor (${g.unit})${valueInput('')}</label><button class="btn" data-act="add">+ Adicionar</button></div>` : ''}`;
  } else {
    $('#recPickName').textContent = 'Pessoa';
    pick.innerHTML = recData.users.map(u => `<option value="${u.id}" ${u.id === recState.userId ? 'selected' : ''}>${esc(u.name)}</option>`).join('');
    const mine = new Map(recData.records.filter(r => r.userId === recState.userId).map(r => [r.game, r]));
    box.innerHTML = `<table class="tickets users"><thead><tr><th>Jogo</th><th>Recorde</th><th>Partidas</th><th></th></tr></thead><tbody>
      ${menuOrder().map(([id, g]) => {
        const r = mine.get(id);
        return `<tr data-game="${id}" data-user="${recState.userId}">
          <td>${g.emoji} ${g.name}</td><td>${valueInput(r?.best)} ${unitOf(id)}</td><td>${r ? r.count : '<span class="hint">—</span>'}</td>
          <td><div class="actions"><button class="btn ghost" data-act="save">${r ? 'Salvar' : '+ Adicionar'}</button>${r ? '<button class="btn ghost" data-act="del">Apagar</button>' : ''}</div></td></tr>`;
      }).join('')}</tbody></table>`;
  }
  box.querySelectorAll('[data-act]').forEach(b => b.onclick = () => recordAction(b));
}

async function recordAction(btn) {
  const row = btn.closest('[data-game]'), game = row.dataset.game, g = GAMES[game];
  const act = btn.dataset.act;
  const userId = act === 'add' ? +row.querySelector('.rec-u').value : row.dataset.user ? +row.dataset.user : null;
  const who = act === 'add' ? row.querySelector('.rec-u').selectedOptions[0].textContent
    : row.dataset.name || recData.users.find(u => u.id === userId)?.name || '';
  try {
    if (act === 'del') {
      if (!confirm(`Apagar TODAS as partidas de ${who} em ${g.name}? Não dá pra desfazer.`)) return;
      const { removed } = await api('api/admin/records/delete', { method: 'POST', body: { game, userId, name: row.dataset.name } });
      await loadRecords(`🗑️ ${who}: ${removed} partida(s) apagada(s) em ${g.name}.`);
    } else {
      const raw = row.querySelector('.rec-v').value;
      if (raw === '') return alert('Digite um valor.');
      const value = Number(raw);
      const { removed } = await api('api/admin/records', { method: 'PUT', body: { game, userId, value } });
      await loadRecords(`✅ ${who} — ${g.name}: recorde agora é ${fmt(g, value)}${removed ? ` (${removed} partida(s) melhor(es) removida(s))` : ''}.`);
    }
    fetchScores(); // atualiza o ranking que o resto da página mostra
  } catch (err) { alert(err.message); }
}

async function previewHtml(geikoId) {
  try {
    const g = await api('api/admin/preview?geikoId=' + encodeURIComponent(geikoId));
    if (g.error) return `<p class="err">${esc(g.error)}</p>`;
    return `<p style="margin:0 0 8px"><b>${g.blocked ? '🔒 Bloqueado' : '✅ Liberado'}</b> — ${g.tickets.length} tickets, soma <b>${fmtW(g.total)}</b> (limite ${fmtW(g.limit)})</p>${ticketsTable(g.tickets)}`;
  } catch (err) { return `<p class="err">${esc(err.message)}</p>`; }
}

function tempPasswordDialog(name, pass) {
  const { el, close } = modal(`
    <h2>Senha temporária</h2>
    <p>Passe pra <b>${esc(name)}</b>. No primeiro login a pessoa cria a própria senha. <b>Ela não aparece de novo.</b></p>
    <div class="secret">${esc(pass)}</div>
    <button class="btn ghost" id="copyPass">Copiar</button>
    <button class="btn" id="okPass">Pronto</button>`, { locked: true });
  el.querySelector('#copyPass').onclick = async e => { await navigator.clipboard?.writeText(pass).catch(() => {}); e.target.textContent = 'Copiado ✓'; };
  el.querySelector('#okPass').onclick = close;
}

async function createUser(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  $('#nuErr').textContent = '';
  try {
    const { user, tempPassword } = await api('api/admin/users', { method: 'POST', body: Object.fromEntries(f) });
    e.target.reset();
    loadUsers();
    tempPasswordDialog(user.name, tempPassword);
  } catch (err) { $('#nuErr').textContent = err.message; }
}

async function loadUsers() {
  const table = $('#usersTable');
  if (!table) return;
  try {
    const { users } = await api('api/admin/users');
    table.innerHTML = `<thead><tr><th>Nome</th><th>Usuário</th><th>ID Geiko</th><th>Papel</th><th></th></tr></thead><tbody>` +
      users.map(u => `<tr class="${u.active ? '' : 'off'}" data-id="${u.id}">
        <td>${esc(u.name)}${u.mustChange ? ' <span class="tag" title="Ainda não trocou a senha temporária">• senha temporária</span>' : ''}${u.active ? '' : ' <span class="tag">• desativada</span>'}${u.block ? ` <span class="tag" style="color:var(--red)" title="${esc(u.block.reason || '')}">• 🔒 bloqueado ${untilText(u.block.until)}</span>` : ''}</td>
        <td>${esc(u.username)}</td>
        <td>${u.geikoId ? esc(u.geikoId) : '<span class="hint">—</span>'}</td>
        <td><span class="pill-role ${u.role}">${u.role === 'admin' ? 'Admin' : 'Jogador'}</span></td>
        <td><div class="actions">${u.canEditRecords && u.id !== me.id ? '<span class="hint">conta do dono</span>' : `
          ${u.id === me.id ? '' : u.block ? '<button class="btn ghost" data-act="unblock">🔓 Desbloquear</button>' : '<button class="btn ghost" data-act="block">🔒 Bloquear</button>'}
          ${u.geikoId ? '<button class="btn ghost" data-act="test">Fila</button>' : ''}
          <button class="btn ghost" data-act="edit">Editar</button>
          <button class="btn ghost" data-act="reset">Nova senha</button>
          ${u.id === me.id ? '' : `<button class="btn ghost" data-act="toggle">${u.active ? 'Desativar' : 'Reativar'}</button>`}`}
        </div></td></tr>`).join('') + '</tbody>';
    table.querySelectorAll('[data-act]').forEach(b => b.onclick = () => userAction(b.dataset.act, users.find(u => u.id === +b.closest('tr').dataset.id)));
    loadOnline(); // bloquear/desbloquear também muda a lista de online
  } catch (err) { table.innerHTML = `<tbody><tr><td class="err">${esc(err.message)}</td></tr></tbody>`; }
}

async function userAction(act, u) {
  if (act === 'unblock') {
    try { await api(`api/admin/users/${u.id}/unblock`, { method: 'POST', body: {} }); loadUsers(); }
    catch (err) { alert(err.message); }
  }
  if (act === 'block') {
    const endOfDay = () => { const d = new Date(); d.setHours(23, 59, 0, 0); return Math.max(1, Math.round((d - Date.now()) / 60000)); };
    const { el, close } = modal(`
      <h2>🔒 Bloquear ${esc(u.name)}</h2>
      <p>A pessoa continua entrando e vendo o ranking, mas não joga. Se estiver jogando, a partida é encerrada em até ~20s.</p>
      <form id="bf" class="admin">
        <label>Por quanto tempo
          <select name="minutes">
            <option value="15">15 minutos</option><option value="30">30 minutos</option><option value="60" selected>1 hora</option>
            <option value="120">2 horas</option><option value="eod">Até o fim do dia</option><option value="0">Até eu desbloquear</option>
          </select></label>
        <label>Motivo (opcional — a pessoa vê)<input name="reason" maxlength="120" placeholder="ex.: fila de tickets cheia"></label>
        <p class="err" id="berr"></p>
        <button class="btn">Bloquear</button>
        <button type="button" class="btn ghost" id="bcancel">Cancelar</button>
      </form>`, { wide: true });
    el.querySelector('#bcancel').onclick = close;
    el.querySelector('#bf').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target), v = f.get('minutes');
      try {
        await api(`api/admin/users/${u.id}/block`, { method: 'POST', body: { minutes: v === 'eod' ? endOfDay() : Number(v), reason: f.get('reason') } });
        close(); loadUsers();
      } catch (err) { el.querySelector('#berr').textContent = err.message; }
    };
  }
  if (act === 'test') {
    const { el, close } = modal(`<h2>Fila de ${esc(u.name)}</h2><div id="pv"><p>Consultando o Geiko...</p></div><button class="btn" id="pvc">Fechar</button>`, { wide: true });
    el.querySelector('#pvc').onclick = close;
    el.querySelector('#pv').innerHTML = await previewHtml(u.geikoId);
  }
  if (act === 'reset') {
    if (!confirm(`Gerar uma nova senha temporária pra ${u.name}? A senha atual deixa de funcionar e a pessoa é deslogada.`)) return;
    try { const { tempPassword } = await api(`api/admin/users/${u.id}/reset-password`, { method: 'POST', body: {} }); loadUsers(); tempPasswordDialog(u.name, tempPassword); }
    catch (err) { alert(err.message); }
  }
  if (act === 'toggle') {
    if (u.active && !confirm(`Desativar ${u.name}? A pessoa é deslogada e não consegue mais entrar.`)) return;
    try { await api(`api/admin/users/${u.id}`, { method: 'PATCH', body: { active: !u.active } }); loadUsers(); }
    catch (err) { alert(err.message); }
  }
  if (act === 'edit') {
    const { el, close } = modal(`
      <h2>Editar conta</h2>
      <form id="ef" class="admin">
        <label>Nome (aparece no ranking)<input name="name" maxlength="40" value="${esc(u.name)}" required></label>
        <label>Usuário (login)<input name="username" maxlength="32" value="${esc(u.username)}" required></label>
        <label>ID do Geiko (vazio = sem fila, nunca bloqueia)<input name="geikoId" inputmode="numeric" value="${esc(u.geikoId || '')}"></label>
        <label>Papel<select name="role" ${u.id === me.id ? 'disabled' : ''}><option value="player">Jogador</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option></select></label>
        <p class="err" id="eerr"></p>
        <button class="btn">Salvar</button>
        <button type="button" class="btn ghost" id="ecancel">Cancelar</button>
      </form>`, { wide: true });
    el.querySelector('#ecancel').onclick = close;
    el.querySelector('#ef').onsubmit = async e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      if (u.id === me.id) delete body.role;
      try {
        const { user } = await api(`api/admin/users/${u.id}`, { method: 'PATCH', body });
        if (user.id === me.id) setMe({ ...me, ...user });
        close(); loadUsers();
      } catch (err) { el.querySelector('#eerr').textContent = err.message; }
    };
  }
}

async function loadRules() {
  const form = $('#rulesForm');
  if (!form) return;
  try {
    const { rules, situations } = await api('api/admin/rules');
    const sitEntries = Object.entries(situations).sort((a, b) => a[1].localeCompare(b[1]));
    form.innerHTML = `
      <div class="row" style="margin-bottom:var(--space-sm)">
        <label class="checks"><label><input type="checkbox" name="enabled" ${rules.enabled ? 'checked' : ''}> Bloqueio ligado</label></label>
        <label>Bloqueia quando a soma passar de<input type="number" name="limit" step="0.25" min="0" value="${rules.limit}"></label>
      </div>
      <p class="note" style="margin-bottom:6px">Peso por prioridade</p>
      <div class="row" style="margin-bottom:var(--space-sm)">
        ${PRIO_FIELDS.map(([k, label]) => `<label>${label}<input type="number" name="p_${k}" step="0.25" min="0" value="${rules.priority[k]}"></label>`).join('')}
      </div>
      <div class="row" style="margin-bottom:var(--space-sm)">
        <label>× sem interação do atendente<input type="number" name="noInteractionMult" step="0.05" min="0" value="${rules.noInteractionMult}"></label>
        <label>× status de espera (abaixo)<input type="number" name="waitingClientMult" step="0.05" min="0" value="${rules.waitingClientMult}"></label>
      </div>
      <p class="note" style="margin-bottom:6px">Status de espera — ticket com interação nesses status pesa menos (o atendente depende de outra pessoa):</p>
      <div class="checks" style="margin-bottom:var(--space-sm)">
        ${sitEntries.length ? sitEntries.map(([id, name]) => `<label><input type="checkbox" name="sit" value="${id}" ${rules.waitingClientSituationIds.includes(+id) ? 'checked' : ''}> ${esc(name)}</label>`).join('')
          : '<span class="hint">Não consegui buscar os status no Geiko agora.</span>'}
      </div>
      <div class="row"><button class="btn">Salvar regra</button><span id="rulesMsg" class="hint"></span></div>`;
    form.onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(form);
      const body = {
        enabled: f.get('enabled') === 'on',
        limit: f.get('limit'),
        priority: Object.fromEntries(PRIO_FIELDS.map(([k]) => [k, f.get('p_' + k)])),
        noInteractionMult: f.get('noInteractionMult'),
        waitingClientMult: f.get('waitingClientMult'),
        // sem a lista do Geiko na tela, mantém a que já estava salva
        waitingClientSituationIds: sitEntries.length ? f.getAll('sit').map(Number) : rules.waitingClientSituationIds,
      };
      try { await api('api/admin/rules', { method: 'PUT', body }); $('#rulesMsg').textContent = '✅ Regra salva — vale a partir da próxima consulta de cada um.'; refreshGate(true); }
      catch (err) { $('#rulesMsg').textContent = '⚠️ ' + err.message; }
    };
  } catch (err) { form.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

// menu da conta (topo)
function toggleAcct(open = $('#acctMenu').hidden) {

}
document.addEventListener('click', e => { if (!e.target.closest('.acct')) toggleAcct(false); });

function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let pageVersion = null;

  if (localMode) return;
  try {
    const { version } = await (await fetch('api/version')).json();
    if (pageVersion === null) pageVersion = version;
    else if (version !== pageVersion && $('.hero') && !$('.modal')) location.reload();
  } catch {}
}
checkVersion();

// acima dos cards já desenhados, empurraria tudo pra baixo (CLS). O título "Hora do intervalo" já vem no HTML.
(async function boot() {
  if (localMode) return showMenu(); // aberto direto do arquivo: sem servidor, sem login
  let me0 = null;
  try { me0 = await api('api/auth/me'); } catch {}
  const { user = null, gate: g = null, reason } = me0 || {};
  if (user) { setMe(user); if (!user.mustChange) gate = g; }

  if (!me0) return loginModal('Não consegui falar com o servidor. Tente de novo.');
  if (!user) return loginModal(reason === 'other-device' ? 'Sua conta entrou em outro dispositivo — só dá pra usar em um por vez.' : '');

})();
