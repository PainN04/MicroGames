<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroGame</title>
<meta name="theme-color" content="#161625">
<!-- use-credentials: nas versões de teste da Vercel (protegidas por login) o navegador baixa o manifesto sem cookie e leva 401; aí o Chrome diz "não é possível instalar" -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MicroGame">
<!-- ?v=N: o navegador guarda o ícone da aba pelo endereço; troque o número sempre que mudar a marca -->
<link rel="icon" href="favicon.ico?v=4" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=optional" rel="stylesheet">
<!-- modo leve (js/perf.js) já no primeiro desenho: sem isso o PC fraco engasga com o fundo animado antes do JS carregar -->
<script>try{(function(s){var p=s.getItem('mg_perf');if(p==='lite'||(p!=='full'&&s.getItem('mg_perf_auto')==='lite'))document.documentElement.classList.add('lite')})(localStorage)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <button class="logo" id="home" aria-label="MicroGame: voltar ao menu"><img class="mark" src="icons/logo.svg" alt="" width="50" height="40"><span class="wm">Micro<span>Game</span></span></button>
  <div class="who">
    <span class="pill compact" id="db" title="conectando..."><span class="dot"></span><span id="dbtxt">conectando...</span></span>
    <button class="btn ghost icon-btn" id="mute" aria-label="Desligar som"></button>
    <span class="gate-wrap" id="gateWrap" hidden>
      <button class="gate-pill" id="gatePill" aria-haspopup="dialog" aria-expanded="false" aria-controls="gatePop"></button>
      <span class="gate-pop glass" id="gatePop" role="dialog" aria-label="Sua fila no Geiko" hidden></span>
    </span>
    <span class="acct"><button class="btn ghost acct-btn" id="acctBtn" aria-haspopup="menu" aria-expanded="false"><span class="av" id="pav" aria-hidden="true"></span><b id="pname">—</b><span class="nbadge" id="nbadge" hidden></span><span class="chev" aria-hidden="true"></span></button>
      <span class="acct-menu glass" id="acctMenu" role="menu" hidden>
        <span class="acct-who" id="acctWho"></span>
        <button role="menuitem" id="mNotes"><span data-ic="bell"></span>Avisos<span class="cnt" id="notesCnt" hidden></span></button>
        <button role="menuitem" id="mDuo"><span data-ic="users"></span>Minha dupla<span class="cnt" id="duoCnt" hidden></span></button>
        <span class="acct-sep" role="separator"></span>
        <button role="menuitem" id="mProfile"><span data-ic="user"></span>Meu perfil</button>
        <span class="acct-sep" role="separator" id="sepAdmin" hidden></span>
        <button role="menuitem" id="mAdmin" hidden><span data-ic="settings"></span>Administração</button>
        <span class="acct-sep" role="separator"></span>
        <!-- desempenho: ficavam no topo, como dois botões a mais; aqui são chaves (o estado aparece na própria linha) -->
        <button role="menuitemcheckbox" id="fx3d" aria-checked="true"><span data-ic="sparkles"></span>Animações 3D<span class="sw" aria-hidden="true"></span></button>
        <button role="menuitemcheckbox" id="lite" aria-checked="false"><span data-ic="gauge"></span>Modo leve<span class="sw" aria-hidden="true"></span></button>
        <span class="acct-sep" role="separator"></span>
        <button role="menuitem" id="mPass"><span data-ic="key-round"></span>Trocar senha</button>
        <button role="menuitem" id="mLogout"><span data-ic="log-out"></span>Sair</button>
      </span>
    </span>
  </div>
</header>
<main id="main">
  <!-- já vem no HTML: é o maior elemento da tela (LCP) e aparece antes de qualquer JS -->
  <section class="hero">
    <h1>Hora do <em>intervalo</em>.</h1>
    <p>27 minigames rápidos e 13 jogos diários. Bata o recorde da galera.</p>
  </section>
</main>
<div class="sr-only" role="status" aria-live="polite" id="live"></div>
